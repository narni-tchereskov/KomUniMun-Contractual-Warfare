		#loc_KUM_kumSpaceSatellite1_title = 敌方卫星
		#loc_KUM_kumSpaceSatellite1_desc = 我们近期追踪到一颗可能携带武器的敌方侦察卫星，它维持着敌方的通信网络，并对其所在轨道平面内的任何飞船构成严重威胁，因此必须立即处理。\n\n消灭这颗敌方信号情报卫星。
		#loc_KUM_kumSpaceSatellite1_synopsis = 消灭轨道上的一颗敌方卫星。
		#loc_KUM_kumSpaceSatellite1_completed = 任务完成！该轨道平面已经清空。

		#loc_KUM_kumSpaceEkv1_title = 发生故障的大气层外拦截飞行器
		#loc_KUM_kumSpaceEkv1_desc = 一架敌方大气层外拦截飞行器近期在武器测试中发生故障。鉴于它存在于太空中的性质，必须立即予以处理。\n\n该单位会攻击任何接近它的目标，因此在将其击毁时务必极度谨慎。
		#loc_KUM_kumSpaceEkv1_synopsis = 消灭轨道上一架故障的动能拦截器（EKV）。
		#loc_KUM_kumSpaceEkv1_completed = 任务完成！威胁已被消除，行动可以恢复。
