		#loc_KUM_kumSpaceRequired_title = 侦察卫星
		#loc_KUM_kumSpaceRequired_desc = 我们近期追踪到一颗无武装的侦察卫星，并确认它携带一面大型天线，很可能用于信号情报。接近目标，检查后将其摧毁。
