		#loc_KUM_kumRequiredUav_title = 出现在KSC上空的不明飞行器
		#loc_KUM_kumRequiredUav_desc = 一架不明飞行器近期侵入了KSC空域。为保障我方行动安全，你必须识别并摧毁这架入侵飞行器。
		#loc_KUM_kumRequiredUav_synopsis = 识别该飞行器，然后将其击落。
		#loc_KUM_kumRequiredUav_completed = 任务完成！这次入侵相当可疑，我们将查阅飞行日志，然后向你通报情况。

		#loc_KUM_kumAerialBadlands1_title = 荒地空中编队拦截
		#loc_KUM_kumAerialBadlands1_desc = 在我方设施遭到袭击后，我们查阅了飞行日志，发现敌方活动总能追溯到荒地。据报告，该地区是敌方单位的聚集地。我们打算对该地区进行侦察，因此你必须先解决掉这些单位。\n为我们的侦察单位清出通路，拦截并摧毁当地的空中力量。
		#loc_KUM_kumAerialBadlands1_synopsis = 拦截敌方单位，以便我们在荒地的行动能够展开。
		#loc_KUM_kumAerialBadlands1_completed = 任务完成！我们已经开始行动，不过还有一些问题，请等待我们稍后的通知。

		#loc_KUM_kumAerialBadlands2_title = 荒地清剿行动
		#loc_KUM_kumAerialBadlands2_desc = 在上次行动之后，敌方派出大量飞行器巡逻荒地空域，这严重妨碍了我们在该地区的行动。因此，你必须清剿残余的敌方力量，为我们在该地区继续开展空中、地面和海上行动扫清道路。\n解决敌方抵抗，清空这片空域，让我们能够继续驻留！
		#loc_KUM_kumAerialBadlands2_synopsis = 清剿荒地地区的敌方力量，以便我方行动能够继续。
		#loc_KUM_kumAerialBadlands2_completed = 任务完成！我们的行动还能在一段时间内不受干扰地继续，而且侦察队有情报要与你分享。

		#loc_KUM_kumAerialBadlandsPlains1_title = 巡逻荒地以东的平原
		#loc_KUM_kumAerialBadlandsPlains1_desc = 总部要求对荒地以东的平原进行巡逻。该地区附近似乎出现了敌方飞行器，必须予以处理。\n这次任务距离我方设施很远，请确保携带足够的燃料，并尽快解决敌人。
		#loc_KUM_kumAerialBadlandsPlains1_synopsis = 巡逻荒地上空及东部平原，处理该地区的敌方飞行器。
		#loc_KUM_kumAerialBadlandsPlains1_completed = 任务完成！你已获准返回基地。

		#loc_KUM_kumAerialBadlandsSteppe1_title = 荒地草原战斗空中巡逻
		#loc_KUM_kumAerialBadlandsSteppe1_desc = 在荒地以西的草原上发现敌方单位，该地区靠近我方部分设施。因此，你的任务是在该地区执行战斗空中巡逻，处理任何出现的单位。\n务必携带足够的燃料，并解决敌人——如果放任不管，他们会对我们构成严重威胁。
		#loc_KUM_kumAerialBadlandsSteppe1_synopsis = 在荒地上空及西部草原执行战斗空中巡逻。
		#loc_KUM_kumAerialBadlandsSteppe1_completed = 任务完成！敌方已被解决，我方设施不再受其威胁。

		#loc_KUM_kumAerialBadLake1_title = 荒地附近的海上交战
		#loc_KUM_kumAerialBadLake1_desc = 敌军已在荒地附近集结其海军力量，最近又派出一个飞行器编队巡逻该空域。\n该地区对我们极具价值，因为我们怀疑那里有他们的主要设施之一。因此，你必须解决这些单位，以便我方侦察队对该地区进行勘察。
		#loc_KUM_kumAerialBadLake1_synopsis = 在荒地附近与一支敌方海军航空编队交战。
		#loc_KUM_kumAerialBadLake1_completed = 任务完成！我方侦察队即将出发，请为下一次任务做好准备。

		#loc_KUM_kumAerialBadLake2_title = 荒地海上压制
		#loc_KUM_kumAerialBadLake2_desc = 我们在荒地附近的侦察任务发现了若干值得关注的地点，其中一些有部队调动的痕迹。我们必须继续在该地区行动以查明他们的设施，但敌方一直保持在该地区的持续空中存在。\n我们需要摧毁这些空中单位，为我们创造任务机会窗口——这正是需要你出手的地方。
		#loc_KUM_kumAerialBadLake2_synopsis = 消灭敌方飞行器，为我们的侦察行动创造机会窗口。
		#loc_KUM_kumAerialBadLake2_completed = 任务完成！侦察机和侦察兵已开始在该地区行动。

		#loc_KUM_kumAerialDessertAssault1_title = 阻止对沙漠航天港的突袭
		#loc_KUM_kumAerialDessertAssault1_desc = 敌方已组建一支由多架飞行器组成的攻击编队，目前正待命攻击沙漠航天港。\n我们不能让他们的行动得逞，你必须拦截这股敌军并消灭所有单位。\n\n动用一切可用物资，摧毁敌人！
		#loc_KUM_kumAerialDessertAssault1_synopsis = 阻止敌方编队对沙漠航天港的突袭准备。
		#loc_KUM_kumAerialDessertAssault1_completed = 任务完成！他们的突袭被挫败，我们可以重新集结，准备发起我们自己的反击。

		#loc_KUM_kumAerialDessertGradient1_title = 清除沙漠地区的空中支援
		#loc_KUM_kumAerialDessertGradient1_desc = 在最近对Kerbin沙漠地区的袭击之后，敌方地面单位在斜坡附近伏击了我方部队。在这次伏击中，敌方空中单位一直为炮火校射并提供近距离空中支援。因此，我们需要你协助摧毁他们的这些力量。
		#loc_KUM_kumAerialDessertGradient1_synopsis = 摧毁敌方的空中支援单位。
		#loc_KUM_kumAerialDessertGradient1_completed = 任务完成！多亏了你，我方部队得以从该地区撤退。

		#loc_KUM_kumAerialCraterSea1_title = 陨石坑海域上空的巡逻
		#loc_KUM_kumAerialCraterSea1_desc = 在大陨石坑以西，我们观察到一支规模不小的海上巡逻队，这可能威胁到该地区的行动，因此我们要求击落这些飞行器。负责该行动的单位至今未归。\n摧毁敌方飞行器，以便我们搜寻上次行动的幸存者。
		#loc_KUM_kumAerialCraterSea1_synopsis = 摧毁敌方飞行器，以支援搜救行动。
		#loc_KUM_kumAerialCraterSea1_completed = 任务完成！搜救队已经派出，返回基地听取汇报。

		#loc_KUM_kumAerialIsland1_title = KSC东部群岛入侵
		#loc_KUM_kumAerialIsland1_desc = 敌人对KSC正东半岛附近的岛屿发动了入侵，似乎是空中单位在支援该地区的海上行动。摧毁这些单位，夺回该地区的空域。我们将进行空中侦察，定位该地区的一切地面设施与资产。
		#loc_KUM_kumAerialIsland1_synopsis = 摧毁支援东部群岛一带海上行动的飞行器。
		#loc_KUM_kumAerialIsland1_completed = 任务完成！侦察队已定位到一些设施，返回基地接受下一个任务。

		#loc_KUM_kumAerialIsland2_title = 敌方岛屿占领部队
		#loc_KUM_kumAerialIsland2_desc = 荒地附近的一座岛屿近期被敌方占领。这座岛屿是建立前哨站、为其入侵当地力量的行动提供支援的理想位置，因此我们在该地区观察到定期巡逻。我们正准备对该地区进行一次侦察行动，以定位他们的设施。为确保这次行动成功，你必须摧毁该地区所有敌方飞行器。
		#loc_KUM_kumAerialIsland2_synopsis = 支援对敌方占领岛屿上空的侦察行动。
		#loc_KUM_kumAerialIsland2_completed = 任务完成！侦察单位已在该地区勘察地形。

		#loc_KUM_kumAerialK7R1_title = K7R空域交战
		#loc_KUM_kumAerialK7R1_desc = 我们正在搜寻敌方的主要行动基地，总部已下令执行一次侦察任务。\n在这次任务中，我们在K7R空域上方探测到大量空中力量。你的任务是飞往那里并将它们击落。\n\n这将是一场艰苦的交战，检验你技术的时刻到了。
		#loc_KUM_kumAerialK7R1_synopsis = 消灭K7R空域上空的大批敌方飞行器。
		#loc_KUM_kumAerialK7R1_completed = 任务完成！空域已经清空，我们可以着手下一个行动了。

		#loc_KUM_kumAerialK7ROutpost1_title = K7R前哨站空域交战
		#loc_KUM_kumAerialK7ROutpost1_desc = 在我们上次飞越K7R空域时，一架侦察机发现了一处敌方前哨站，他们似乎正在集结部队，准备攻击我方沙漠设施。\n这架飞机还报告说有大量敌人在该空域巡逻，它不得不撤离以免被击落。
		#loc_KUM_kumAerialK7ROutpost1_synopsis = 消灭K7R前哨站上空的一批敌方飞行器。
		#loc_KUM_kumAerialK7ROutpost1_completed = 任务完成！既然空域已经清空，拔掉这处前哨站将容易得多。

		#loc_KUM_kumAerialKerbalonPixy_title = Kerbalon河附近的敌方目标
		#loc_KUM_kumAerialKerbalonPixy_desc = 一架原型战斗机近期被盗，我们在Kerbalon河附近探测到一艘信号特征与之吻合的飞船。\n这架飞行器搭载了特殊武器，请留意它的集束导弹和定向能武器。\n你必须从河道方向接近，以免被发现，然后与它展开空战。\n\n我们绝不容忍这架飞行器被盗走，摧毁它。
		#loc_KUM_kumAerialKerbalonPixy_synopsis = 摧毁Kerbalon河附近被盗的飞行器。
		#loc_KUM_kumAerialKerbalonPixy_completed = 任务完成！原型机已被成功摧毁。我们已安排好与你的飞行员会面，请放心，他会没事的。

