		#loc_KUM_kumRequiredUav_title = KSC上空的未知飞行器
		#loc_KUM_kumRequiredUav_desc = 一架不明飞行器近期侵犯了KSC空域，为了我们行动的安全，你必须识别并摧毁这架入侵飞行器。
		#loc_KUM_kumRequiredUav_synopsis = 识别飞行器并将其击落。
		#loc_KUM_kumRequiredUav_completed = 任务完成！这是一次相当可疑的入侵，我们将检查编队日志，然后向你通报情况。

		#loc_KUM_kumAerialBadlands1_title = 荒地空中群组拦截
		#loc_KUM_kumAerialBadlands1_desc = 在我们设施遭受袭击后，我们检查了编队日志，发现敌方活动始终可以追溯到荒地。据报道，该地区是敌方单位的温床，我们打算在该地区进行侦察，因此，你必须处理掉这些单位。\nClear the way for our recon units by intercepting and destroying the local air power.
		#loc_KUM_kumAerialBadlands1_synopsis = 拦截敌方单位，以便我们在荒地的行动能够开始。
		#loc_KUM_kumAerialBadlands1_completed = 任务完成！我们已经开始了行动，但存在一些问题，请等待我们稍后的通知。

		#loc_KUM_kumAerialBadlands2_title = 荒地清剿行动
		#loc_KUM_kumAerialBadlands2_desc = 在我们上次行动之后，敌方力量派遣了大量飞行器前往巡逻荒地空域，这严重阻碍了我们在该地区的行动。因此，你必须清剿剩余的敌方力量，为我们在该地区继续进行的空中、地面和海军行动扫清道路。\nDeal with the enemy opposition clearing the airspace for us to remain!
		#loc_KUM_kumAerialBadlands2_synopsis = 清剿荒地地区的敌方力量，以便我们的行动能继续进行。
		#loc_KUM_kumAerialBadlands2_completed = 任务完成！我们的行动现在可以不受干扰地继续进行一段时间，而且我们的侦察队有情报要分享。

		#loc_KUM_kumAerialBadlandsPlains1_title = 巡逻荒地东部平原
		#loc_KUM_kumAerialBadlandsPlains1_desc = 总部要求对荒地以东的平原进行巡逻，似乎在该地区发现了一些敌方飞行器，必须予以处理。\nEnsure you have enough fuel for this mission as it is a long way from our facilities and deal with the enemy ASAP.
		#loc_KUM_kumAerialBadlandsPlains1_synopsis = 巡逻荒地上空及东部平原，处理该地区的敌方飞行器。
		#loc_KUM_kumAerialBadlandsPlains1_completed = 任务完成！你已被批准返回基地。

		#loc_KUM_kumAerialBadlandsSteppe1_title = 荒地草原战斗空中巡逻
		#loc_KUM_kumAerialBadlandsSteppe1_desc = 在荒地以西的草原上发现了敌对单位，该地区靠近我们的一些设施。因此，你的任务是在该地区进行战斗空中巡逻，以处理任何存在的单位。\nEnsure enough fuel is taken and the enemies are dealt with as they pose a serious threat to us if left alone.
		#loc_KUM_kumAerialBadlandsSteppe1_synopsis = 在荒地上空及西部草原进行战斗空中巡逻。
		#loc_KUM_kumAerialBadlandsSteppe1_completed = 任务完成！敌方已被清除，我们的设施不再受到它们的威胁。

		#loc_KUM_kumAerialBadLake1_title = 荒地附近的海上交战
		#loc_KUM_kumAerialBadLake1_desc = 敌军已在荒地附近集结其海军力量，最近他们派遣了一支飞行器编队巡逻该空域。\nThe area is of high interest to us as it's suspected to house one of their main facilities, as such, you must deal with these units so that our reconnaissance teams may conduct a survey of the area.
		#loc_KUM_kumAerialBadLake1_synopsis = 在荒地附近与一支敌方海军飞行器编队交战。
		#loc_KUM_kumAerialBadLake1_completed = 任务完成！我们的侦察队即将出发，为下一个任务做好准备。

		#loc_KUM_kumAerialBadLake2_title = 荒地海军压制
		#loc_KUM_kumAerialBadLake2_desc = 我们在荒地附近的侦察任务发现了几个感兴趣的地点，其中一些有部队移动的痕迹。我们必须继续在该地区的行动以发现他们的设施，然而，敌人一直保持着在该地区的持续空中存在。\nWe need these aerial units destroyed to give us a mission opportunity window, that's where you come in.
		#loc_KUM_kumAerialBadLake2_synopsis = 消灭敌方飞行器，为我们的侦察行动打开机会窗口。
		#loc_KUM_kumAerialBadLake2_completed = 任务完成！侦察机和侦察兵已开始在该地区行动。

		#loc_KUM_kumAerialDessertAssault1_title = 中断对沙漠航天港的突袭
		#loc_KUM_kumAerialDessertAssault1_desc = 敌人组建了一个由数架飞行器组成的攻击群，目前正准备攻击沙漠航天港。\nWe cannot allow their operation to take place, you must intercept the hostile force and eliminate all units.\n\nWith all materiel available, destroy the enemy!
		#loc_KUM_kumAerialDessertAssault1_synopsis = 阻止敌方群组对沙漠航天港的突袭准备。
		#loc_KUM_kumAerialDessertAssault1_completed = 任务完成！他们的突袭被挫败，我们可以重新集结，准备我们自己的反击。

		#loc_KUM_kumAerialDessertGradient1_title = 沙漠斜坡空中支援清除
		#loc_KUM_kumAerialDessertGradient1_desc = 在最近对Kerbin沙漠地区的突袭之后，敌方地面单位在斜坡附近伏击了我们的部队。在这次伏击中，空中单位一直在校正炮火并提供近距离空中支援。因此，我们需要你协助摧毁他们的资产。
		#loc_KUM_kumAerialDessertGradient1_synopsis = 摧毁敌方空中支援单位。
		#loc_KUM_kumAerialDessertGradient1_completed = 任务完成！多亏了你，我们的力量得以从该地区撤退。

		#loc_KUM_kumAerialCraterSea1_title = 环形山海上的海军巡逻
		#loc_KUM_kumAerialCraterSea1_desc = 在大环形山以西，我们观察到一次大规模的海军巡逻，这可能对该地区的行动构成威胁。因此，我们要求消灭这些飞行器。负责此行动的单位尚未返回。\nDestroy the hostile aircraft in order to allow us to search for any survivors of the last operation.
		#loc_KUM_kumAerialCraterSea1_synopsis = 摧毁敌方飞行器以支援搜救行动。
		#loc_KUM_kumAerialCraterSea1_completed = 任务完成！搜救队已派出，返回基地进行汇报。

		#loc_KUM_kumAerialIsland1_title = KSC东部岛屿入侵
		#loc_KUM_kumAerialIsland1_desc = 敌人对KSC正东半岛附近的岛屿发动了入侵，似乎是空中单位在支援该地区的海军行动。摧毁这些单位，夺回该地区的空域。我们将进行空中侦察，定位该地区的任何地面资产和设施。
		#loc_KUM_kumAerialIsland1_synopsis = 摧毁支援东部岛屿地区海军行动的飞行器。
		#loc_KUM_kumAerialIsland1_completed = 任务完成！侦察队已定位到一些设施，返回基地接受下一个任务。

		#loc_KUM_kumAerialIsland2_title = 敌方岛屿占领部队
		#loc_KUM_kumAerialIsland2_desc = 荒地附近的一个岛屿最近被敌方力量占领，这个岛屿是建立一个前哨以支援对其当地力量入侵的理想地点，因此在该地区观察到定期巡逻。我们正准备对该地区进行一次侦察行动以定位他们的设施。为了确保这次行动的成功，你必须摧毁该地区所有敌方飞行器。
		#loc_KUM_kumAerialIsland2_synopsis = 支援对敌方占领岛屿上空的侦察行动。
		#loc_KUM_kumAerialIsland2_completed = 任务完成！侦察单位已在该地区监视地形。

		#loc_KUM_kumAerialK7R1_title = K7R空域交战
		#loc_KUM_kumAerialK7R1_desc = 总部已下达进行侦察任务的命令，因为我们正在搜寻敌方的主要行动基地。\nDuring this mission, we detected a large number of air assets above airspace K7R. Your mission is to fly there and shoot them down.\n\nThis will be a difficult engagement, the time to test your skills has come.
		#loc_KUM_kumAerialK7R1_synopsis = 在K7R空域消灭一大群敌方飞行器。
		#loc_KUM_kumAerialK7R1_completed = 任务完成！现在空域已清空，我们可以进行下一个行动了。

		#loc_KUM_kumAerialK7ROutpost1_title = K7R前哨空域交战
		#loc_KUM_kumAerialK7ROutpost1_desc = 在我们上次飞越K7R空域时，一架侦察机发现了一个敌方前哨，他们似乎正在集结部队以攻击我们的沙漠设施。\nThe aircraft also reported a large number of hostiles patrolling the airspace and had to flee to avoid being shot down.
		#loc_KUM_kumAerialK7ROutpost1_synopsis = 在K7R前哨上空消灭一群敌方飞行器。
		#loc_KUM_kumAerialK7ROutpost1_completed = 任务完成！既然空域已清空，摧毁前哨将容易得多。

		#loc_KUM_kumAerialKerbalonPixy_title = Kerbalon河附近的敌对目标
		#loc_KUM_kumAerialKerbalonPixy_desc = 一架原型战斗机最近被盗，我们在Kerbalon河附近检测到一架RCS信号匹配的飞船。\nThe aircraft has special weapons, remain aware of its burst missiles and directed energy weapon.\nYou must approach the aircraft from the river in order to remain undetected and then engage the aircraft in aerial combat.\n\nWe cannot tolerate robbery of this aircraft, destroy it.
		#loc_KUM_kumAerialKerbalonPixy_synopsis = 摧毁Kerbalon河附近被盗的飞行器。
		#loc_KUM_kumAerialKerbalonPixy_completed = 任务完成！原型机已被成功摧毁，我们已经安排了与你的飞行员会面，放心，他会没事的。

		#loc_KUM_kumAerialKerbalonPlains1_title = Kerbalon平原上空的巡逻拦截
		#loc_KUM_kumAerialKerbalonPlains1_desc = 最高指挥部命令你在Kerbalon空域拦截一支敌方巡逻队，一项行动即将展开，因此保持这些平原上空地区的空域畅通至关重要。There is an enemy outpost nearby so stay cautious of SAM sites and Anti-Aircraft batteries in the area.
		#loc_KUM_kumAerialKerbalonPlains1_synopsis = 在Kerbalon平原上空拦截敌方巡逻队，以支援该地区的行动。
		#loc_KUM_kumAerialKerbalonPlains1_completed = 任务完成！多亏了你，行动的成功率提高了，返回基地汇报。

		#loc_KUM_kumAerialKerbalonTundra1_title = Kerbalon苔原上空的突击
		#loc_KUM_kumAerialKerbalonTundra1_desc = 你的任务是在Kerbalon苔原上空进行一次突击。一项高度重要的行动即将在该地区开始，因此在行动进行时保持空域畅通至关重要。\nFly over to Kerbalon and deal with a section of hostile aircraft which poses a serious threat to our mission.
		#loc_KUM_kumAerialKerbalonTundra1_synopsis = 在Kerbalon苔原上空进行突击，以支援该地区的行动。
		#loc_KUM_kumAerialKerbalonTundra1_completed = 任务完成！我们的行动离执行又近了一步，但还有更多工作要做。

		#loc_KUM_kumAerialKerbalonTundra2_title = Kerbalon苔原上空的敌对群组
		#loc_KUM_kumAerialKerbalonTundra2_desc = 在Kerbalon苔原上空探测到一个敌方编队，我们的行动即将开始，不能容忍敌方存在。你的任务是摧毁这些由战斗机和无人机组成的飞行器，它们一直在干扰我们的行动。\nDeal with the aircraft ASAP and return to base safely, the operation cannot be allowed to fail.
		#loc_KUM_kumAerialKerbalonTundra2_synopsis = 消灭Kerbalon苔原上空的敌方编队，以支援该地区的行动。
		#loc_KUM_kumAerialKerbalonTundra2_completed = 任务完成！这样我们离行动又近了一步，返回报告以接受其他任务。

		#loc_KUM_kumAerialKerbalonTundra3_title = Kerbalon苔原清剿行动
		#loc_KUM_kumAerialKerbalonTundra3_desc = 在我们上次于Kerbalon苔原交战之后，敌人决定派遣所有剩余资产来阻止我们在该地区行动。为了我们的行动成功，你必须清剿该地区剩余的敌方力量，确保空域 cleared。\nEliminate these remaining units and then immediately return to base, the operation will be commencing shortly after your arrival.
		#loc_KUM_kumAerialKerbalonTundra3_synopsis = 清剿Kerbalon苔原上空的残余敌人，以支援该地区的行动。
		#loc_KUM_kumAerialKerbalonTundra3_completed = 任务完成！我们的行动计划进展顺利，稍后将与你联系以了解详情。

		#loc_KUM_kumAerialKSCAssault1_title = 中断对KSC的突袭
		#loc_KUM_kumAerialKSCAssault1_desc = 敌人组建了一个由数架飞行器组成的攻击群，目前正准备攻击KSC。\nWe cannot allow their operation to take place, you must intercept the hostile force and eliminate all units.\n\nWith all materiel available, destroy the enemy!
		#loc_KUM_kumAerialKSCAssault1_synopsis = 阻止敌方群组对KSC的突袭准备。
		#loc_KUM_kumAerialKSCAssault1_completed = 任务完成！他们的突袭被挫败，我们可以重新集结，准备我们自己的反击。

		#loc_KUM_kumAerialKSCGradient1_title = KSC斜坡上空的行动
		#loc_KUM_kumAerialKSCGradient1_desc = 在我们于该地区的行动被一群敌方飞行器干扰后，我们发出了在KSC东北部斜坡上空进行行动的请求。我们在该地区的一个前哨遭到袭击，这些飞行器仍在巡逻该空域，徘徊不去。\nQuickly intercept and destroy the hostile force so that we may resume our operations in the area.
		#loc_KUM_kumAerialKSCGradient1_synopsis = 消灭敌方群组，以便恢复在该地区的行动。
		#loc_KUM_kumAerialKSCGradient1_completed = 任务完成！我们已经开始修复我们的前哨，等待我们稍后的通知。

		#loc_KUM_kumAerialKSCPlains1_title = 巡逻KSC平原
		#loc_KUM_kumAerialKSCPlains1_desc = 由于在KSC附近发现敌方飞行器的次数增加，总部要求在KSC西南部的平原进行一次巡逻。似乎最近有敌方飞行器在该地区活动，找到并摧毁它们，因为它们对我们在该地区的所有行动构成严重威胁。
		#loc_KUM_kumAerialKSCPlains1_synopsis = 在KSC西南部的平原进行巡逻，并摧毁该地区的飞行器。
		#loc_KUM_kumAerialKSCPlains1_completed = 任务完成！敌方飞行器已被成功消灭，该地区再次 cleared。

		#loc_KUM_kumAerialKSCSea1_title = 巡逻KSC海域
		#loc_KUM_kumAerialKSCSea1_desc = KSC以东的海域最近成为争夺区，许多敌方空中和海军巡逻中断了我们在该地区的行动，甚至试图封锁KSC本身。\nWe have confirmed that at least one section was patrolling over this airspace moments ago, conduct a patrol of the area, intercept these aircraft and destroy them.
		#loc_KUM_kumAerialKSCSea1_synopsis = 在KSC以东海域巡逻时，拦截并消灭一部分敌方飞行器。
		#loc_KUM_kumAerialKSCSea1_completed = 任务完成！我们已派遣飞船回收残骸，返回基地汇报。

		#loc_KUM_kumAerialMahi1_title = Mahi Mahi基地占领
		#loc_KUM_kumAerialMahi1_desc = 敌对力量目前正威胁要占领Mahi Mahi岛，我们不能允许这种情况发生。我们探测到一个正在巡逻该空域的单元，处理掉他们，以便我们的空降力量能夺取该地区并定位敌方设施。\nIt is of high priority that the Mahi Mahi island remains under our control, we cannot allow their occupation of the area to succeed.
		#loc_KUM_kumAerialMahi1_synopsis = 摧毁目前在Mahi Mahi岛上空巡逻的敌方单元。
		#loc_KUM_kumAerialMahi1_completed = 任务完成！你成功突破了敌方力量的防线，我们已在该地区 secured a foothold。

		#loc_KUM_kumAerialMahi2_title = Mahi Mahi上空的敌方战斗机
		#loc_KUM_kumAerialMahi2_desc = 在我们上次于该地区行动后，敌方力量派遣了一支飞行器编队骚扰我们的部队，我们不能允许他们对地区的压力持续下去。\nScramble to intercept these aircraft ASAP, destroy all of them to relieve our ground forces' operations from aerial harassment.
		#loc_KUM_kumAerialMahi2_synopsis = 拦截并摧毁在Mahi Mahi岛战区骚扰我们地面力量的敌方飞行器。
		#loc_KUM_kumAerialMahi2_completed = 任务完成！我们的地面力量对你的协助表示感谢。

		#loc_KUM_kumAerialMahi3_title = Mahi Mahi上空的无人机毁灭
		#loc_KUM_kumAerialMahi3_desc = 敌对力量在Mahi Mahi岛战区保持着持续的 pressure，最近他们派遣了一队由空中优势战斗机支援的无人机，以维持对我们地面单位的 pressure，我们不能容忍这种情况。\nDestroy all hostile aircraft over the Mahi Mahi island, freeing our units from the constant surveillance and harassment of their aerial units.
		#loc_KUM_kumAerialMahi3_synopsis = 摧毁Mahi Mahi岛上空所有敌方飞行器，以减轻对我们地面力量的空中骚扰。
		#loc_KUM_kumAerialMahi3_completed = 任务完成！地面部队已恢复向敌方设施的推进。

		#loc_KUM_kumAerialMahi4_title = 清剿Mahi Mahi区域
		#loc_KUM_kumAerialMahi4_desc = 一直坚持控制Mahi Mahi岛的敌人决定对该地区发动最后攻击，探测到一个预警机单元以及多架空中优势战斗机和无人机，他们再次对我们地面力量施加压力。\nDestroy all hostile units and end all hostile operations over the Mahi Mahi island.
		#loc_KUM_kumAerialMahi4_synopsis = 消灭Mahi Mahi岛上空所有剩余的敌方单位。
		#loc_KUM_kumAerialMahi4_completed = 任务完成！地面部队对你的贡献表示万分感激。

		#loc_KUM_kumAerialPolarIsland1_title = 极地空中支援清除
		#loc_KUM_kumAerialPolarIsland1_desc = 敌对力量在南极冰盖附近的一个岛屿上建立了一个设施，情报部门将其识别为一个配备雷达和水听器的前沿观测站，监视着南部海域和荒地的 approach。该设施由飞行器和地对空设施防御。在这次行动中，你的任务是摧毁巡逻该地区的飞行器。\nThe hostile force is comprised of a section of aircraft, destroy them.
		#loc_KUM_kumAerialPolarIsland1_synopsis = 摧毁保卫监视我们动向的前沿哨所的敌方飞行器分队。
		#loc_KUM_kumAerialPolarIsland1_completed = 任务完成！现在可以对前哨发动突击了。

		#loc_KUM_kumAerialPolarLake1_title = 极地舰队空中巡逻
		#loc_KUM_kumAerialPolarLake1_desc = 敌方海军力量位于靠近北极的一个湖泊中，该地区的战斗机持续骚扰我们的力量。我们目前正计划一次行动，以消灭该地区的舰船。为了该行动的成功，必须先处理掉这些飞行器，这就是你的任务。\nEnsure all aerial units are dealt with then RTB immediately to rearm for the upcoming operation.
		#loc_KUM_kumAerialPolarLake1_synopsis = 摧毁极地湖泊上空的飞行器，以便舰船猎杀行动能够开始。
		#loc_KUM_kumAerialPolarLake1_completed = 任务完成！行动将很快开始，地勤人员已 standby 等待你的 arrival。

		#loc_KUM_kumAerialRandomAerial1_title = 低纬度 rogue 交战
		#loc_KUM_kumAerialRandomAerial1_desc = 我们定位了一个 rogue 敌方单元，分析表明它最近从一个更大的群组中分离出来。必须立即摧毁这些飞行器，以防止对我们行动的任何损害或干扰！
		#loc_KUM_kumAerialRandomAerial1_synopsis = 在 rogue 空中单元脆弱时将其消灭。
		#loc_KUM_kumAerialRandomAerial1_completed = 任务完成！低纬度空域现已再次 cleared，可以恢复品尝磅蛋糕了。

		#loc_KUM_kumAerialRandomAerial2_title = 中纬度 rogue 交战
		#loc_KUM_kumAerialRandomAerial2_desc = 我们定位了一个 rogue 敌方单元，分析表明它最近从一个更大的群组中分离出来。必须立即摧毁这些飞行器，以防止对我们行动的任何损害或干扰！
		#loc_KUM_kumAerialRandomAerial2_synopsis = 在 rogue 空中单元脆弱时将其消灭。
		#loc_KUM_kumAerialRandomAerial2_completed = 任务完成！中纬度空域现已再次 cleared，可以恢复品尝磅蛋糕了。

