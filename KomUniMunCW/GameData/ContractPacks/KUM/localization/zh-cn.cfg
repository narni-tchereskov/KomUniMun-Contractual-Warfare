		#loc_KUM_kumAerialSouthernTundra1_title = 南部苔原空中突击
		#loc_KUM_kumAerialSouthernTundra1_desc = 在南部苔原上空探测到飞行器，该地区很可能用于 staging 针对KSC设施和Mahi Mahi地区的敌方行动。本次行动的目标是消灭该地区的飞行器及与此目的相关的设施。
		#loc_KUM_kumAerialSouthernTundra1_synopsis = 突击南部苔原地区，摧毁一支敌方飞行器中队。
		#loc_KUM_kumAerialSouthernTundra1_completed = 任务完成！突击其设施的任务将很快下达。

		#loc_KUM_kumAerialSouthStrait1_title = 南部海峡上空的敌对目标
		#loc_KUM_kumAerialSouthStrait1_desc = 我们探测到一支敌方空中中队飞越其一个前哨。他们的群组中有一个预警机单元，必须被摧毁。\nApproach the hostile squadron and destroy all vehicles, especially the AWACS unit as it is a high value target.\nThis will permit our operations within this airspace to be conducted with greater safety, leaving their outpost far more vulnerable.\nThe eccentric terrain in the area can provide cover during approach.
		#loc_KUM_kumAerialSouthStrait1_synopsis = 清空南极冰盖附近敌方前哨上空的空域。
		#loc_KUM_kumAerialSouthStrait1_completed = 任务完成！既然他们的前哨失去了空中掩护，摧毁它将容易得多！

		#loc_KUM_kumAerialWaterfallPlains1_title = 半岛空中河道巡逻消耗
		#loc_KUM_kumAerialWaterfallPlains1_desc = 我们最近在KSC附近探测到一个敌方前哨，它位于东北方向河流地区。该地区易于防守，因此我们预计会有许多设施存在。在该地区发现一个编队，很可能是巡逻队，你的任务将是摧毁这些飞行器，以便对该地区进行侦察。\nClear a way for our recon teams, access to the eastern sea depends on this operation.
		#loc_KUM_kumAerialWaterfallPlains1_synopsis = 清空敌方控制的关键节点上空的空域。
		#loc_KUM_kumAerialWaterfallPlains1_completed = 任务完成！你的下一个任务已经确定。

		#loc_KUM_kumAerialWaterfallPlains2_title = 东部半岛拦截机巡逻
		#loc_KUM_kumAerialWaterfallPlains2_desc = 在我们上次于该地区行动后，敌方力量在该地区部署了一支拦截机中队，使得我们的侦察机难以进行侦察，它们不得不飞至树梢高度或极端高度以避免探测。你的任务再次是摧毁这些飞行器，我们的情报表明有一个预警机单元提供支援，所以谨慎接近该地区。
		#loc_KUM_kumAerialWaterfallPlains2_synopsis = 通过摧毁敌方拦截机来支援我们的侦察行动。
		#loc_KUM_kumAerialWaterfallPlains2_completed = 任务完成！所有拦截机均已确认摧毁，返回基地接受下一个任务。

		#loc_KUM_kumAerialWaterfallPlains3_title = 东部半岛上空的干预
		#loc_KUM_kumAerialWaterfallPlains3_desc = 在KSC东部的半岛探测到敌对飞行器，他们的力量在附近建立了一个前沿作战基地。拦截这些飞行器，以便我们的侦察队能够定位他们的前沿作战基地并标记为摧毁目标。\nDestroying their aircraft will provide major relief to all KSC operations in the area.
		#loc_KUM_kumAerialWaterfallPlains3_synopsis = 干预并摧毁东部半岛上空的敌方飞行器。
		#loc_KUM_kumAerialWaterfallPlains3_completed = 任务完成！半岛已 cleared，我们的侦察队进展顺利。

		#loc_KUM_kumAerialWaterfallSea1_title = 关键节点空中海军巡逻
		#loc_KUM_kumAerialWaterfallSea1_desc = 在一个关键节点附近探测到敌方飞行器，该地区易受敌方 forces 防御，这阻碍了从KSC向荒地的一些行动。我们需要立即处理这些单位，以恢复我们在该地区的正常运作秩序。\nThis operation may require extra fuel, pack it accordingly.
		#loc_KUM_kumAerialWaterfallSea1_synopsis = 清除关键节点的敌方空中存在。
		#loc_KUM_kumAerialWaterfallSea1_completed = 任务完成！关键节点已 cleared，该地区的空中行动将很快恢复。

