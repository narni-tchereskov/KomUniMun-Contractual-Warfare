		#loc_KUM_kumAerialRequired_title = KSC北部的单元
		#loc_KUM_kumAerialRequired_desc = 预警雷达在KSC北部探测到一个异常，当我们的侦察员接近该地区时，他们立即被两架飞行器锁定为目标。\nAs the enemy has take control of the airspace, your task is to approach the aircraft, identify them if possible and then detroy them.
		#loc_KUM_kumAerialRequired_synopsis = 通过分析和摧毁敌人，回收空域控制权。
