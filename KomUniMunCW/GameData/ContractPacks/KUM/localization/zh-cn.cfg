		// Ground

		#loc_KUM_kumGroundRequired_title = KSC以西的火炮
		#loc_KUM_kumGroundRequired_desc = 我们已在KSC以西确认两门固定部署的火炮。由于它们没有任何识别信号，你必须处理这一情况。\n接近这些火炮并将其摧毁——尽管它们无法移动，但仍对KSC构成严重威胁。\n\n用一切必要手段摧毁这些火炮。
		#loc_KUM_kumGroundRequired_synopsis = 接近这些固定火炮并将其摧毁。
		#loc_KUM_kumGroundRequired_completed = 任务完成！敌方火炮已被摧毁。

		#loc_KUM_kumGroundCraterRim1_title = 清除陨石坑边缘的防空力量
		#loc_KUM_kumGroundCraterRim1_desc = 我们在沙漠机场以西的陨石坑边缘探测到大量敌方防空导弹阵地。这严重打乱了Valentina的假期计划，你必须前往那里将它们清除。\n\n为了我们的假期，夺取该地区的控制权！
		#loc_KUM_kumGroundCraterRim1_synopsis = 清除陨石坑边缘地区的所有防空导弹阵地。
		#loc_KUM_kumGroundCraterRim1_completed = 任务完成！度假之行成功夺回。

		#loc_KUM_kumGroundIslandAirfield1_title = 阻止岛屿机场被占领
		#loc_KUM_kumGroundIslandAirfield1_desc = 近期，一支敌军在KSC以东群岛的机场部署了多个海岸炮阵地，我们还确认那里有防空武器。\n这威胁到KSC以及未来的任何发射，因此必须处理这些单位。\n\n用一切必要手段夺回该地区。
		#loc_KUM_kumGroundIslandAirfield1_synopsis = 摧毁岛屿机场内的所有单位并将其夺回。
		#loc_KUM_kumGroundIslandAirfield1_completed = 任务完成！岛屿机场已成功清空。

		#loc_KUM_kumGroundKSCPlains1_title = 清除KSC平原的敌方巡逻队
		#loc_KUM_kumGroundKSCPlains1_desc = 目前局势正在发展：多股敌军正从西面逼近KSC，他们正在KSC平原巡逻，随后将向我们的设施推进。\n拦截这些单位，并在他们抵达KSC之前将其摧毁。
		#loc_KUM_kumGroundKSCPlains1_synopsis = 阻止巡逻队向KSC推进。
		#loc_KUM_kumGroundKSCPlains1_completed = 任务完成！敌方巡逻队已被成功阻止。

		// Ground FOB

		#loc_KUM_kumGroundFobBadlandsSteppe1_title = 摧毁荒地草原的前沿基地
		#loc_KUM_kumGroundFobBadlandsSteppe1_desc = 我们注意到，敌方在荒地草原的斜坡上成功部署了一处前沿作战基地。这处敌方基地距离我方战区太近，无法容忍。\n立即用一切手段摧毁这处前哨站，但要小心：据报告该地区有敌方防空火力和固定火炮。
		#loc_KUM_kumGroundFobBadlandsSteppe1_synopsis = 定位并摧毁荒地草原斜坡上的一处前沿作战基地。
		#loc_KUM_kumGroundFobBadlandsSteppe1_completed = 任务完成！该地区已成功夺回，附近的行动已经恢复。

		#loc_KUM_kumGroundFobKSCAssault1_title = 摧毁支援突袭KSC的前沿基地
		#loc_KUM_kumGroundFobKSCAssault1_desc = 近期，我们在袭击KSC的空中攻击编队附近发现了一处前哨站，它位于KSC西北方。\n这处前哨站为敌方突袭提供支援，必须立即摧毁。\n尽快接近并摧毁这处前哨站——它对我方行动构成严重威胁，绝不可容忍！\n摧毁敌方前哨站，再次让Kerbin免受其部队威胁！
		#loc_KUM_kumGroundFobKSCAssault1_synopsis = 摧毁支援突袭KSC的一处前沿作战基地。
		#loc_KUM_kumGroundFobKSCAssault1_completed = 任务完成！敌方基地被摧毁，当地的敌方行动陷入瘫痪！

		#loc_KUM_kumGroundFobKSCPlains1_title = KSC平原上的前哨站
		#loc_KUM_kumGroundFobKSCPlains1_desc = 我们在KSC以西发现一处距离KSC近得危险的前沿作战基地。\n我方侦察车近期在该地区被击落，因此这件事就落在你头上了。\n\n接近该地区并制止他们的行动。
		#loc_KUM_kumGroundFobKSCPlains1_synopsis = 接近并摧毁一处距KSC极近的前沿作战基地。
		#loc_KUM_kumGroundFobKSCPlains1_completed = 任务完成！平原再次清空，我方空域也已为当地行动清出。

		#loc_KUM_kumGroundFobKscSea1_title = 摧毁KSC以东岛屿上的前沿基地
		#loc_KUM_kumGroundFobKscSea1_desc = 近期在KSC以东、旧机场之外的一座岛屿上又发现一处前沿作战基地。它靠近KSC海域，构成严重威胁，必须加以处理。\n接近该敌方基地并尽快摧毁它，但要小心：它由多套地对空和地对地系统防护。
		#loc_KUM_kumGroundFobKscSea1_synopsis = 消灭KSC以东岛屿上的一处敌方前沿作战基地。
		#loc_KUM_kumGroundFobKscSea1_completed = 任务完成！我方海上空域已经清空，该地区再次得到控制。

		#loc_KUM_kumGroundFobSouthStrait1_title = 摧毁南部海峡附近的前沿基地
		#loc_KUM_kumGroundFobSouthStrait1_desc = 我们定位到了敌人的一处基地！情报指向南部冰架附近的海峡。天气寒冷，建议多带几层衣物。\n摧毁敌方前哨站，再次让Kerbin免受其部队威胁！\n\n注意：此前也曾发现该地区有敌方空中单位活动。
		#loc_KUM_kumGroundFobSouthStrait1_synopsis = 摧毁南部冰盖附近海峡中的一处敌方基地。
		#loc_KUM_kumGroundFobSouthStrait1_completed = 任务完成！南部海峡已得到控制，我们可以恢复该地区的地面行动。

		#loc_KUM_kumGroundFobWaterfallMountains1_title = 摧毁瀑布山脉中的前沿基地
		#loc_KUM_kumGroundFobWaterfallMountains1_desc = 敌人的一处基地被定位在KSC东北方东部半岛的瀑布山脉中。该地海拔很高，务必准备好你的进气道。\n清除这里的敌人是确保我方地面部队能够推进该地区的优先事项，我们全靠你了。
		#loc_KUM_kumGroundFobWaterfallMountains1_synopsis = 消灭位于KSC东北瀑布山脉地区的一处敌方前哨站。
		#loc_KUM_kumGroundFobWaterfallMountains1_completed = 任务完成！该地区的地面行动已成功恢复，我方地面部队向你致意。

		// Naval

		#loc_KUM_kumNavalRequired_title = KSC东南方的巡逻艇
		#loc_KUM_kumNavalRequired_desc = 在KSC东南方探测到两艘不明巡逻艇，它们正在阻碍该地区的航运，必须予以处理。\n如果可能，请接近这些船只，以便我们收集有关其型号和来源的情报。\n\n你已被授权采取一切必要手段摧毁这些船只。
		#loc_KUM_kumNavalRequired_synopsis = 分析这些巡逻艇并制止其行动。
		#loc_KUM_kumNavalRequired_completed = 任务完成！该地区已得到控制。

		#loc_KUM_kumNavalIslandAirfield1_title = 岛屿机场附近的海军增援
		#loc_KUM_kumNavalIslandAirfield1_desc = 在KSC以东、岛屿机场附近发现了少量巡逻艇。我们最近一次遭到射击的侦察飞行报告了4个目标。\n这些船只只配备轻武器，但仍对我方设施构成威胁。\n\n摧毁它们，夺回我们的海疆！
		#loc_KUM_kumNavalIslandAirfield1_synopsis = 摧毁岛屿机场附近的海军增援力量。
		#loc_KUM_kumNavalIslandAirfield1_completed = 任务完成！机场区域的海上威胁已被清除。

