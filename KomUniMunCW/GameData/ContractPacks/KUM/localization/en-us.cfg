		// Contracts

		// Aerial

		#loc_KUM_kumPlaceholder_title = PLACEHOLDER Title
		#loc_KUM_kumPlaceholder_desc = PLACEHOLDER Description
		#loc_KUM_kumPlaceholder_synopsis = PLACEHOLDER Synopsis
		#loc_KUM_kumPlaceholder_completed = PLACEHOLDER Completed

		#loc_KUM_kumRequiredUav_title = Unidentified aircraft over the KSC
		#loc_KUM_kumRequiredUav_desc = An unidentified aircraft has recently violated KSC airspace, for the safety of our operations you must identify and destroy the violating aircraft.
		#loc_KUM_kumRequiredUav_synopsis = Identify the aircraft and then shoot it down.
		#loc_KUM_kumRequiredUav_completed = Mission accomplished! This was a rather suspicious violation, we will look over the flight log and then debrief you on the situation.

		#loc_KUM_kumAerialBadlands1_title = Badlands Aerial Group Interception
		#loc_KUM_kumAerialBadlands1_desc = Recently after the assaults on our facilities, we looked over the flights logs and discovered the hostile presence consistently traces back to the Badlands. The area has been reported to be a cesspool of hostile units, we intend on conducting reconnaissance in the area and as such, you must deal with these units.\nClear the way for our recon units by intercepting and destroying the local air power.
		#loc_KUM_kumAerialBadlands1_synopsis = Intercept the hostile units so that our operations in the Badlands may commence.
		#loc_KUM_kumAerialBadlands1_completed = Mission accomplished! We have already commenced our operations, there are some issues however, expect to hear from us shortly.

		#loc_KUM_kumAerialBadlands2_title = Badlands Mop Up Operation
		#loc_KUM_kumAerialBadlands2_desc = After our last operation, the hostile forces have sent a large number of aircraft up to patrol the Badlands airspace, this is a major deterrent to our operations in the area, as such, you must mop up the remaining forces, clearing the way for our aerial, ground and naval operations to continue in the area.\nDeal with the enemy opposition clearing the airspace for us to remain!
		#loc_KUM_kumAerialBadlands2_synopsis = Mop up hostile forces in the Badlands region so that our operations may continue.
		#loc_KUM_kumAerialBadlands2_completed = Mission accomplished! Our operations will now continue uninterrupted for a while longer and our recon team has something to share.

		#loc_KUM_kumAerialBadlandsPlains1_title = Patrolling the Plains East of the Badlands
		#loc_KUM_kumAerialBadlandsPlains1_desc = Headquarters has requested that the plains east of the Badlands be patrolled, it seems some hostile aircraft have been sighted around the area and must be dealt with.\nEnsure you have enough fuel for this mission as it is a long way from our facilities and deal with the enemy ASAP.
		#loc_KUM_kumAerialBadlandsPlains1_synopsis = Patrol the airspace over the plains east of the Badlands and deal with the hostile aircraft in the area.
		#loc_KUM_kumAerialBadlandsPlains1_completed = Mission accomplished! You have been cleared to return to base.

		#loc_KUM_kumAerialBadlandsSteppe1_title = Badlands Steppe Combat Air Patrol
		#loc_KUM_kumAerialBadlandsSteppe1_desc = Hostile units have been sighted in the steppe west of the Badlands, the area is close to some of our facilities, as such, you have been tasked with conducting a combat air patrol in the area to deal with any units present.\nEnsure enough fuel is taken and the enemies are dealt with as they pose a serious threat to us if left alone.
		#loc_KUM_kumAerialBadlandsSteppe1_synopsis = Conduct a combat air patrol in the airspace over the steppe west of the Badlands.
		#loc_KUM_kumAerialBadlandsSteppe1_completed = Mission accomplished! The hostiles were taken care of and our facilities are no longer threatened by them.

		#loc_KUM_kumAerialBadLake1_title = Naval Engagement Near the Badlands
		#loc_KUM_kumAerialBadLake1_desc = The enemy force has consolidated its naval forces near the Badlands and recently they launched a flight of aircraft to patrol the airspace.\nThe area is of high interest to us as it's suspected to house one of their main facilities, as such, you must deal with these units so that our reconnaissance teams may conduct a survey of the area.
		#loc_KUM_kumAerialBadLake1_synopsis = Engage a flight of hostile naval aircraft near the Badlands.
		#loc_KUM_kumAerialBadLake1_completed = Mission accomplished! Our reconnaissance teams will be taking off soon, ready yourself for the next mission.

		#loc_KUM_kumAerialBadLake2_title = Badlands Naval Suppression
		#loc_KUM_kumAerialBadLake2_desc = Our reconnaissance missions near the Badlands have discovered several points of interest, some contain traces of troop movements. We must continue our operations in the area to discover their facilities, however, the enemy has been keeping a constant aerial presence in the area.\nWe need these aerial units destroyed to give us a mission opportunity window, that's where you come in.
		#loc_KUM_kumAerialBadLake2_synopsis = Eliminate hostile aircraft to open an opportunity window for our recon operations.
		#loc_KUM_kumAerialBadLake2_completed = Mission accomplished! Recon aircraft and scouts have begun operations in the area.

		#loc_KUM_kumAerialDessertAssault1_title = Interrupt an Assault on the Dessert Spaceport
		#loc_KUM_kumAerialDessertAssault1_desc = The enemy has mounted an attack group comprised of several aircraft and is currently on standby to attack the Dessert Spaceport.\nWe cannot allow their operation to take place, you must intercept the hostile force and eliminate all units.\n\nWith all materiel available, destroy the enemy!
		#loc_KUM_kumAerialDessertAssault1_synopsis = Stop the enemy group's preparations for an assault on the Dessert Spaceport.
		#loc_KUM_kumAerialDessertAssault1_completed = Mission accomplished! With their assault thwarted we can regroup for an attack of our own.

		#loc_KUM_kumAerialDessertGradient1_title = Dessert Air Support Elimination
		#loc_KUM_kumAerialDessertGradient1_desc = After the latest assault on the Dessert area of Kerbin, hostile ground units ambushed our troops near the gradient. Aerial units have been correcting artillery fire and providing close air support during this ambush, as such, we require your assistance in destroying their assets.
		#loc_KUM_kumAerialDessertGradient1_synopsis = Destroy the hostile aerial support units.
		#loc_KUM_kumAerialDessertGradient1_completed = Mission accomplished! Our forces have managed to retreat from the area thanks to you.

		#loc_KUM_kumAerialCraterSea1_title = Naval Patrol Over the Crater Sea
		#loc_KUM_kumAerialCraterSea1_desc = West of the great crater, we have observed a large naval patrol which may pose a threat to operations in the area, as such, we have requested the aircraft be taken out. The units responsible for the operation have not returned.\nDestroy the hostile aircraft in order to allow us to search for any survivors of the last operation.
		#loc_KUM_kumAerialCraterSea1_synopsis = Destroy the hostile aircraft in order to support a search and rescue operation.
		#loc_KUM_kumAerialCraterSea1_completed = Mission accomplished! The search party was dispatched, return to base for debrief.

		#loc_KUM_kumAerialIsland1_title = Eastern KSC Islands Incursion
		#loc_KUM_kumAerialIsland1_desc = The enemy has launched an incursion on the islands near the peninsula due east of the KSC, it seems aerial units are supporting a naval operation in the area. Destroy these units and reclaim the airspace in the area, we will perform aerial reconnaissance and locate any ground assets and facilities in the area.
		#loc_KUM_kumAerialIsland1_synopsis = Destroy the aircraft supporting a naval operation in the area of the eastern islands.
		#loc_KUM_kumAerialIsland1_completed = Mission accomplished! The recon team has located some facilities, return to base for your next assignment.

		#loc_KUM_kumAerialIsland2_title = Hostile Island Occupation Force
		#loc_KUM_kumAerialIsland2_desc = One of the islands near the Badlands was recently occupied by hostile forces, this island is an ideal location to establish an outpost to support an invasion on their local forces and so regular patrols were observed in the area. We are readying a recon operation on the area to locate their facilities and in order to guarantee the success of this operation, you must destroy all hostile aircraft in the area.
		#loc_KUM_kumAerialIsland2_synopsis = Support a reconnaissance operation over a hostile occupied island.
		#loc_KUM_kumAerialIsland2_completed = Mission accomplished! Recon units are already in the area surveilling the landscape.

		#loc_KUM_kumAerialK7R1_title = Engagement Over Airspace K7R
		#loc_KUM_kumAerialK7R1_desc = Headquarters has issued an order for a reconnaissance mission to be conducted as we are searching for the enemy's main base of operations.\nDuring this mission, we detected a large number of air assets above airspace K7R. Your mission is to fly there and shoot them down.\n\nThis will be a difficult engagement, the time to test your skills has come.
		#loc_KUM_kumAerialK7R1_synopsis = Eliminate a large group of hostile aircraft over the K7R airspace.
		#loc_KUM_kumAerialK7R1_completed = Mission accomplished! Now with a clear airspace we can move onto our next operation.

		#loc_KUM_kumAerialK7ROutpost1_title = K7R Outpost Airspace Engagement
		#loc_KUM_kumAerialK7ROutpost1_desc = During our last flyby of airspace K7R a reconnaissance aircraft spotted a hostile outpost, it seems they are amassing troops to attack our dessert facilities.\nThe aircraft also reported a large number of hostiles patrolling the airspace and had to flee to avoid being shot down.
		#loc_KUM_kumAerialK7ROutpost1_synopsis = Eliminate a group of hostile aircraft over the K7R Outpost.
		#loc_KUM_kumAerialK7ROutpost1_completed = Mission accomplished! Now that the airspace is clear taking out the outpost will be much easier.

		#loc_KUM_kumAerialKerbalonPixy_title = Hostile near the Kerbalon River
		#loc_KUM_kumAerialKerbalonPixy_desc = A prototype fighter was recently stolen and we've detected a vessel with a matching RCS signature near the Kerbalon River.\nThe aircraft has special weapons, remain aware of its burst missiles and directed energy weapon.\nYou must approach the aircraft from the river in order to remain undetected and then engage the aircraft in aerial combat.\n\nWe cannot tolerate robbery of this aircraft, destroy it.
		#loc_KUM_kumAerialKerbalonPixy_synopsis = Destroy the stolen aircraft near the Kerbalon River.
		#loc_KUM_kumAerialKerbalonPixy_completed = Mission accomplished! The prototype aircraft was successfully destroyed, we have scheduled a meeting with your pilot, rest assured he will survive.

		#loc_KUM_kumAerialKerbalonPlains1_title = Patrol Interception Over the Kerbalon Plains
		#loc_KUM_kumAerialKerbalonPlains1_desc = High command has tasked you with intercepting a hostile patrol over the Kerbalon Airspace, an operation will be taking place shortly so it is of great importance that the airspace in the area over these plains remains clear. There is an enemy outpost nearby so stay cautious of SAM sites and Anti-Aircraft batteries in the area.
		#loc_KUM_kumAerialKerbalonPlains1_synopsis = Intercept a hostile patrol over the Kerbalon Plains to support an operation in the area.
		#loc_KUM_kumAerialKerbalonPlains1_completed = Mission accomplished! The operation's chances of success have gone up thanks to you, report back to base for debriefing.

		#loc_KUM_kumAerialKerbalonTundra1_title = Assault Over the Kerbalon Tundra
		#loc_KUM_kumAerialKerbalonTundra1_desc = You have been tasked with conducting an assault on the airspace over the Kerbalon tundra, an operation of high importance will soon commence in the area so it is paramount that the airspace is clear when it takes place.\nFly over to Kerbalon and deal with a section of hostile aircraft which poses a serious threat to our mission.
		#loc_KUM_kumAerialKerbalonTundra1_synopsis = Conduct an assault over the Kerbalon tundra to support an operation in the area.
		#loc_KUM_kumAerialKerbalonTundra1_completed = Mission accomplished! Our operation is one step closer to execution, however, there is still more to be done.

		#loc_KUM_kumAerialKerbalonTundra2_title = Hostile Group Over the Kerbalon Tundra
		#loc_KUM_kumAerialKerbalonTundra2_desc = A hostile flight was detected over the Kerbalon tundra, with our operation commencing soon we cannot accept the hostile presence. You will be tasked with destroying these aircraft, consisting of fighters and UAVs which have been interfering with our operations.\nDeal with the aircraft ASAP and return to base safely, the operation cannot be allowed to fail.
		#loc_KUM_kumAerialKerbalonTundra2_synopsis = Eliminate the hostile flight over the Kerbalon tundra to support an operation in the area.
		#loc_KUM_kumAerialKerbalonTundra2_completed = Mission accomplished! With this we are once again closer to our operation, report back for other assignments.

		#loc_KUM_kumAerialKerbalonTundra3_title = Kerbalon Tundra Mop Up
		#loc_KUM_kumAerialKerbalonTundra3_desc = After our last engagement in the Kerbalon tundra, the enemy decided to send all their remaining assets to impede us from operating in the area. In order for our operation to succeed, you must mop up the remaining forces in the area and ensure the airspace is cleared.\nEliminate these remaining units and then immediately return to base, the operation will be commencing shortly after your arrival.
		#loc_KUM_kumAerialKerbalonTundra3_synopsis = Mop up the remaining enemies over the Kerbalon tundra to support an operation in the area.
		#loc_KUM_kumAerialKerbalonTundra3_completed = Mission accomplished! Our operation plans are proceeding smoothly, you will be contacted soon with details.

		#loc_KUM_kumAerialKSCAssault1_title = Interrupt an Assault on the KSC
		#loc_KUM_kumAerialKSCAssault1_desc = The enemy has mounted an attack group comprised of several aircraft and is currently on standby to attack the KSC.\nWe cannot allow their operation to take place, you must intercept the hostile force and eliminate all units.\n\nWith all materiel available, destroy the enemy!
		#loc_KUM_kumAerialKSCAssault1_synopsis = Stop the enemy group's preparations for an assault on the KSC.
		#loc_KUM_kumAerialKSCAssault1_completed = Mission accomplished! With their assault thwarted we can regroup for an attack of our own.

		#loc_KUM_kumAerialKSCGradient1_title = Operation Over the KSC Gradient
		#loc_KUM_kumAerialKSCGradient1_desc = A request for an operation over the gradient to the north-east of the KSC was dispatched after our operations in the area were disturbed by a group of hostile aircraft. One of our outposts in the area was attacked and the aircraft still linger in the area, patrolling the airspace.\nQuickly intercept and destroy the hostile force so that we may resume our operations in the area.
		#loc_KUM_kumAerialKSCGradient1_synopsis = Eliminate the hostile group in order to resume operations in the area.
		#loc_KUM_kumAerialKSCGradient1_completed = Mission accomplished! We have begun repairs on our outpost, expect to hear from us soon.

		#loc_KUM_kumAerialKSCPlains1_title = Patrolling the KSC Plains
		#loc_KUM_kumAerialKSCPlains1_desc = Due to increased sighting of enemy aircraft in the vincinity of the KSC, headquarters has delivered a request for a patrol to be conducted in the plains south-west of the KSC. It seems recently hostile aircraft were recently in the area, locate and destroy them as they pose a serious threat to all of our operations in the area.
		#loc_KUM_kumAerialKSCPlains1_synopsis = Conduct a patrol in the plains south-west of the KSC and destroy the aircraft in the area.
		#loc_KUM_kumAerialKSCPlains1_completed = Mission accomplished! The hostile aircraft were successfully dispatched, the area has been cleared once more.

		#loc_KUM_kumAerialKSCSea1_title = Patrolling the KSC Sea
		#loc_KUM_kumAerialKSCSea1_desc = The sea east of the KSC has been contested recently, with many hostile aerial and naval patrols interrupting our operations in the area and even attempting to blockade the KSC itself.\nWe have confirmed that at least one section was patrolling over this airspace moments ago, conduct a patrol of the area, intercept these aircraft and destroy them.
		#loc_KUM_kumAerialKSCSea1_synopsis = Intercept a section of hostile aircraft while patrolling over the sea east of the KSC.
		#loc_KUM_kumAerialKSCSea1_completed = Mission accomplished! We have dispatched vessels to recover the wrecks, return to base for debriefing.

		#loc_KUM_kumAerialMahi1_title = Mahi Mahi Getaway Occupation
		#loc_KUM_kumAerialMahi1_desc = Hostile forces are currently threathing an occupation of the Mahi Mahi island, we cannot allow this to happen. We have detected an element currently patrolling the airspace, deal with them so that our airborne forces can seize the area and locate hostile installations.\nIt is of high priority that the Mahi Mahi island remains under our control, we cannot allow their occupation of the area to succeed.
		#loc_KUM_kumAerialMahi1_synopsis = Destroy a hostile element currently patrolling over the Mahi Mahi island.
		#loc_KUM_kumAerialMahi1_completed = Mission accomplished! You successfully breached the hostile forces' defenses and we have secured a foothold in the area.

		#loc_KUM_kumAerialMahi2_title = Hostile Fighters Over Mahi Mahi
		#loc_KUM_kumAerialMahi2_desc = After our last operation in the area, hostile forces dispatched a flight of aircraft to harass our troops, we cannot allow their pressure on the area to continue.\nScramble to intercept these aircraft ASAP, destroy all of them to relieve our ground forces' operations from aerial harassment.
		#loc_KUM_kumAerialMahi2_synopsis = Intercept and destroy the hostile aircraft harassing our ground forces in the Mahi Mahi island theatre.
		#loc_KUM_kumAerialMahi2_completed = Mission accomplished! Our ground forces have expressed their gratitude over your assistance.

		#loc_KUM_kumAerialMahi3_title = Drone Destruction Over Mahi Mahi
		#loc_KUM_kumAerialMahi3_desc = Hostile forces maintain their persistence in the Mahi Mahi island theatre, recently they sent a section of drones supported by air superiority fighters in order to maintain pressure on our ground units, we cannot tolerate this.\nDestroy all hostile aircraft over the Mahi Mahi island, freeing our units from the constant surveillance and harassment of their aerial units.
		#loc_KUM_kumAerialMahi3_synopsis = Destroy all hostile aircraft over the Mahi Mahi island to relieve our ground forces of aerial harassment.
		#loc_KUM_kumAerialMahi3_completed = Mission accomplished! Ground troops have resumed their movement upon the hostile facilities.

		#loc_KUM_kumAerialMahi4_title = Mopping Up the Mahi Mahi Area
		#loc_KUM_kumAerialMahi4_desc = The enemy which has been persistent over control of the Mahi Mahi island decided to launch a last ditch attack on the area, an AWACS unit was detected along with multiple air superiority fighters and drones, they are maintaining pressure on our ground forces once more.\nDestroy all hostile units and end all hostile operations over the Mahi Mahi island.
		#loc_KUM_kumAerialMahi4_synopsis = Eliminate all remaining hostile units which remain over the Mahi Mahi island.
		#loc_KUM_kumAerialMahi4_completed = Mission accomplished! Ground troops are overwhelmingly grateful towards your contributions to their operations.

		#loc_KUM_kumAerialPolarIsland1_title = Arctic Air Support Elimination
		#loc_KUM_kumAerialPolarIsland1_desc = Hostile forces have set up a facility in an island near the southern ice cap, intelligence forces identified it as a forward observation installation with radars and hydrophones monitoring approach to the southern sea and badlands. The facility is defended by aircraft and surface-to-air installations, in this operation you will be tasked with destroying the aircraft patrolling the area.\nThe hostile force is comprised of a section of aircraft, destroy them.
		#loc_KUM_kumAerialPolarIsland1_synopsis = Destroy a hostile section of aircraft defending a forward outpost monitoring our movements.
		#loc_KUM_kumAerialPolarIsland1_completed = Mission accomplished! Assaults on the outpost can now be conducted.

		#loc_KUM_kumAerialPolarLake1_title = Polar Fleet Air Patrol
		#loc_KUM_kumAerialPolarLake1_desc = Enemy naval forces were located in a lake close to the North Pole and fighters in the area have been harassing our forces continuously. We are currently planning an operation to take out the vessels in the area, in order for that operation to succeed the aircraft must be dealt with, that will be your task.\nEnsure all aerial units are dealt with then RTB immediately to rearm for the upcoming operation.
		#loc_KUM_kumAerialPolarLake1_synopsis = Destroy the aircraft over a polar lake so that a vessel hunting operation may commence.
		#loc_KUM_kumAerialPolarLake1_completed = Mission accomplished! The operation will commence shortly, ground crews are on standby for your arrival.

		#loc_KUM_kumAerialRandomAerial1_title = Low Latitude Rogue Engagement
		#loc_KUM_kumAerialRandomAerial1_desc = We have located a rogue hostile element, analysis suggests it has recently separated from a larger group. These aircraft must be destroyed immediately to prevent any damages or interference with our operations!
		#loc_KUM_kumAerialRandomAerial1_synopsis = Eliminate a rogue aerial element while it is vulnerable.
		#loc_KUM_kumAerialRandomAerial1_completed = Mission accomplished! The low latitude airspace is now clear once more and Pound Cake tasting can be resumed.

		#loc_KUM_kumAerialRandomAerial2_title = Mid Latitude Rogue Engagement
		#loc_KUM_kumAerialRandomAerial2_desc = We have located a rogue hostile element, analysis suggests it has recently separated from a larger group. These aircraft must be destroyed immediately to prevent any damages or interference with our operations!
		#loc_KUM_kumAerialRandomAerial2_synopsis = Eliminate a rogue aerial element while it is vulnerable.
		#loc_KUM_kumAerialRandomAerial2_completed = Mission accomplished! The mid latitude airspace is now clear once more and Pound Cake tasting can be resumed.

		#loc_KUM_kumAerialRandomAerial3_title = High Latitude Rogue Engagement
		#loc_KUM_kumAerialRandomAerial3_desc = We have located a rogue hostile element, analysis suggests it has recently separated from a larger group. These aircraft must be destroyed immediately to prevent any damages or interference with our operations!
		#loc_KUM_kumAerialRandomAerial3_synopsis = Eliminate a rogue aerial element while it is vulnerable.
		#loc_KUM_kumAerialRandomAerial3_completed = Mission accomplished! The high latitude airspace is now clear once more and Pound Cake tasting can be resumed.

		#loc_KUM_kumAerialRequired_title = Element North of the KSC
		#loc_KUM_kumAerialRequired_desc = Early warning radars have detected an anomaly north of the KSC, when our scouts approached the area they were immediately targeted by two aircraft.\nAs the enemy has taken control of the airspace, your task is to approach the aircraft, identify them if possible and then destroy them.
		#loc_KUM_kumAerialRequired_synopsis = Recover airspace control by analyzing and destroying the enemy.
		#loc_KUM_kumAerialRequired_completed = Mission accomplished! The airspace is clear once more!

		#loc_KUM_kumAerialSouthernTundra1_title = Southern Tundra Aerial Assault
		#loc_KUM_kumAerialSouthernTundra1_desc = Aircraft have been detected over the southern tundra, the area likely serves to stage hostile operations directed towards the KSC facilities and Mahi Mahi area. The objective of this operation is eliminating the aircraft in the area and the facilities associated with this purpose.
		#loc_KUM_kumAerialSouthernTundra1_synopsis = Assault the southern tundra area to destroy a squadron of hostile aircraft.
		#loc_KUM_kumAerialSouthernTundra1_completed = Mission accomplished! An assignment to assault their facilities will be dispensed shortly.

		#loc_KUM_kumAerialSouthStrait1_title = Hostiles Over the Southern Strait
		#loc_KUM_kumAerialSouthStrait1_desc = We have detected an enemy aerial squadron overflying one of their outposts. Within their group is an AWACS unit which must be destroyed.\nApproach the hostile squadron and destroy all vehicles, especially the AWACS unit as it is a high value target.\nThis will permit our operations within this airspace to be conducted with greater safety, leaving their outpost far more vulnerable.\nThe eccentric terrain in the area can provide cover during approach.
		#loc_KUM_kumAerialSouthStrait1_synopsis = Clear the airspace over a hostile outpost near the Southern Ice Cap.
		#loc_KUM_kumAerialSouthStrait1_completed = Mission accomplished! Now that their outpost has no aerial cover, destroying it will be far easier!

		#loc_KUM_kumAerialWaterfallPlains1_title = Peninsula Aerial River Patrol Wasting
		#loc_KUM_kumAerialWaterfallPlains1_desc = We recently detected an enemy outpost close to the KSC, it is located in the area of the river due North-East. The area is easily defensible and as such we expect many facilities to be present. A flight was spotted in the area, likely a patrol, your task will be destroying the aircraft to permit reconnaissance of the area.\nClear a way for our recon teams, access to the eastern sea depends on this operation.
		#loc_KUM_kumAerialWaterfallPlains1_synopsis = Clear the airspace over an enemy controlled chokepoint.
		#loc_KUM_kumAerialWaterfallPlains1_completed = Mission accomplished! Your next assignment has already been defined.

		#loc_KUM_kumAerialWaterfallPlains2_title = Eastern Peninsula Interceptor Patrol
		#loc_KUM_kumAerialWaterfallPlains2_desc = After our last operation in the area, hostile forces have deployed a squadron of interceptors to the area, making recon difficult for our aircraft which have to fly at treetop level or extreme altitudes to avoid detection. You have been tasked once more with destroying these aircraft, our intel suggests an AWACS unit is providing support so approach the area with caution.
		#loc_KUM_kumAerialWaterfallPlains2_synopsis = Support our recon operation by destroying the hostile interceptors.
		#loc_KUM_kumAerialWaterfallPlains2_completed = Mission accomplished! All interceptors were confirmed destroyed, RTB for your next assignment.

		#loc_KUM_kumAerialWaterfallPlains3_title = Intervention Over the Eastern Peninsula
		#loc_KUM_kumAerialWaterfallPlains3_desc = Hostile aircraft were detected in the peninsula east of the KSC, their forces have estabilished a FOB nearby. Intercept these aircraft so that our recon teams may proceed to locate their FOB and mark it for destruction.\nDestroying their aircraft will provide major relief to all KSC operations in the area.
		#loc_KUM_kumAerialWaterfallPlains3_synopsis = Intervene and destroy hostile aircraft over the Eastern Peninsula.
		#loc_KUM_kumAerialWaterfallPlains3_completed = Mission accomplished! With the peninsula cleared our recon teams are proceeding smoothly.

		#loc_KUM_kumAerialWaterfallSea1_title = Chokepoint Aerial Naval Patrol
		#loc_KUM_kumAerialWaterfallSea1_desc = Near a chokepoint hostile aircraft were detected, this area is easily defensible by hostile forces and this has impeded some operations directed towards the badlands from the KSC. We require that these units be dealt with immediately in order to resume our regular functioning order in the area.\nThis operation may require extra fuel, pack it accordingly.
		#loc_KUM_kumAerialWaterfallSea1_synopsis = Free a chokepoint of hostile aerial presence.
		#loc_KUM_kumAerialWaterfallSea1_completed = Mission accomplished! The chokepoint has been cleared, aerial operations on the area will resume shortly.

		#loc_KUM_kumAerialWoomerangAssault1_title = Interrupt an Assault on Woomerang
		#loc_KUM_kumAerialWoomerangAssault1_desc = The enemy has mounted an attack group comprised of several aircraft and is currently on standby to attack Woomerang.\nWe cannot allow their operation to take place, you must intercept the hostile force and eliminate all units.\n\nWith all materiel available, destroy the enemy!
		#loc_KUM_kumAerialWoomerangAssault1_synopsis = Stop the enemy group's preparations for an assault on Woomerang.
		#loc_KUM_kumAerialWoomerangAssault1_completed = Mission accomplished! With their assault thwarted we can regroup for an attack of our own.

		#loc_KUM_kumTestBalloon1_title = Destroy a target balloon
		#loc_KUM_kumTestBalloon1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
		#loc_KUM_kumTestBalloon1_synopsis = Test some hardware while destroying a target balloon.
		#loc_KUM_kumTestBalloon1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestDrone1_title = Destroy a target drone
		#loc_KUM_kumTestDrone1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
		#loc_KUM_kumTestDrone1_synopsis = Test some hardware while destroying a target drone.
		#loc_KUM_kumTestDrone1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestFloat1_title = Destroy a floating target
		#loc_KUM_kumTestFloat1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
		#loc_KUM_kumTestFloat1_synopsis = Test some hardware while destroying a floating target.
		#loc_KUM_kumTestFloat1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestSatellite1_title = Destroy a target satellite
		#loc_KUM_kumTestSatellite1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in. Due to the proliferation of space debris as a consequence of this mission, it is likely that observers will condone this operation.
		#loc_KUM_kumTestSatellite1_synopsis = Test some hardware while destroying a target satellite.
		#loc_KUM_kumTestSatellite1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestStatic1_title = Destroy a static target
		#loc_KUM_kumTestStatic1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
		#loc_KUM_kumTestStatic1_synopsis = Test some hardware while destroying a static target.
		#loc_KUM_kumTestStatic1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestSubmarine1_title = Destroy a submarine target
		#loc_KUM_kumTestSubmarine1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
		#loc_KUM_kumTestSubmarine1_synopsis = Test some hardware while destroying a submarine target.
		#loc_KUM_kumTestSubmarine1_completed = Success! The staff at our facility is overjoyed with the data!

		// Ground

		#loc_KUM_kumGroundRequired_title = Artillery West of the KSC
		#loc_KUM_kumGroundRequired_desc = We have identified two static emplaced artillery west of the KSC, being that these have no identification, you must deal with the situation.\nApproach the artillery and destroy them, although stationary they pose a serious threat to the KSC.\n\nDestroy the artillery through any menas necessary.
		#loc_KUM_kumGroundRequired_synopsis = Approach the static artillery and destroy them.
		#loc_KUM_kumGroundRequired_completed = Mission accomplished! Hostile artillery destroyed.

		#loc_KUM_kumGroundCraterRim1_title = Crater Rim Air Defense Elimination
		#loc_KUM_kumGroundCraterRim1_desc = We have detected a large number of hostile SAM sites on the Crater Rim west of the Desert Airfield. This has put a severe thorn in Valentina's holiday plans, you must go there and take them out.\n\nTake control of the location for the sake of our holidays!
		#loc_KUM_kumGroundCraterRim1_synopsis = Eliminate all SAM sites in the crater rim area.
		#loc_KUM_kumGroundCraterRim1_completed = Mission accomplished! The holiday getaway was successfully retrieved.

		#loc_KUM_kumGroundIslandAirfield1_title = Interrupt the Island Airfield Takeover
		#loc_KUM_kumGroundIslandAirfield1_desc = Recently, an enemy force has deployed multiple coastal artillery positions to the airfield in the islands east of the KSC, we have confirmed Anti-Aircraft weaponry as well.\nThis threatens the KSC and any future launches, as such, these units must be dealt with.\n\nReclaim the area through any means necessary.
		#loc_KUM_kumGroundIslandAirfield1_synopsis = Destroy all units in the island airfield and retake it.
		#loc_KUM_kumGroundIslandAirfield1_completed = Mission accomplished! The island airfield was successfully cleared.

		#loc_KUM_kumGroundKSCPlains1_title = KSC Plains Hostile Patrol Elimination
		#loc_KUM_kumGroundKSCPlains1_desc = Currently, a situation is developing, with multiple hostile forces approaching the KSC from the west, they are currently conducting a patrol in the KSC Plains before moving onto our facilities.\nIntercept these units and destroy them before they reach the KSC.
		#loc_KUM_kumGroundKSCPlains1_synopsis = Stop the patrol group moving towards the KSC.
		#loc_KUM_kumGroundKSCPlains1_completed = Mission accomplished! The hostile patrol was halted successfully.

		// Ground FOB

		#loc_KUM_kumGroundFobBadlandsSteppe1_title = Destroy the Badlands Steppe FOB
		#loc_KUM_kumGroundFobBadlandsSteppe1_desc = It has come to our attention that the enemy managed to deploy a FOB in the Badlands Steppe gradient. The proximity of this hostile base to our theater of operations cannot be tolerated.\nDestroy the outpost immediately through any means, however beware, hostile aerial defenses and static artillery have been reported in the area.
		#loc_KUM_kumGroundFobBadlandsSteppe1_synopsis = Locate and destroy a FOB in the badlands steppe gradient.
		#loc_KUM_kumGroundFobBadlandsSteppe1_completed = Mission accomplished! The area was successfully reclaimed and operations nearby have resumed.

		#loc_KUM_kumGroundFobKSCAssault1_title = Destroy the KSC Assault FOB
		#loc_KUM_kumGroundFobKSCAssault1_desc = Recently, an outpost was discovered together with the aerial assault group sent to attack the KSC, it is located to the north-west of the KSC.\nThis outpost supports the hostile assault and must be destroyed immediately.\nApproach and destroy the outpost ASAP, it poses a severe threat to our operations and cannot be tolerated!\nDestroy the enemy outpost to secure Kerbin from their forces once more!
		#loc_KUM_kumGroundFobKSCAssault1_synopsis = Destroy a FOB supporting an assault on the KSC.
		#loc_KUM_kumGroundFobKSCAssault1_completed = Mission accomplished! The hostile base was destroyed and local hostile operations were crippled!

		#loc_KUM_kumGroundFobKSCPlains1_title = Outpost in the KSC Plains
		#loc_KUM_kumGroundFobKSCPlains1_desc = To the west of the KSC we located a forward operating base dangerously close to the KSC.\nOur recon vehicles were shot down in the area recently, as such it falls on you to deal with the issue.\n\nApproach the area and halt their operation.
		#loc_KUM_kumGroundFobKSCPlains1_synopsis = Approach and destroy a FOB dangerously close to the KSC.
		#loc_KUM_kumGroundFobKSCPlains1_completed = Mission accomplished! The plains are clear once more and our airspace has been cleared for local operations.

		#loc_KUM_kumGroundFobKscSea1_title = Destroy the Island FOB east of the KSC
		#loc_KUM_kumGroundFobKscSea1_desc = Another FOB was recently located east of the KSC on the island past the old airfield, its proximity to the KSC sea is a serious threat which must be addressed.\nApproach the enemy base and destroy it ASAP, however beware, it is protected by multiple Surface-to-Air and Surface-to-Surface systems.
		#loc_KUM_kumGroundFobKscSea1_synopsis = Eliminate a hostile FOB on the island to the east of the KSC.
		#loc_KUM_kumGroundFobKscSea1_completed = Mission accomplished! Our naval airspace has been cleared and the area secured once more.

		#loc_KUM_kumGroundFobSouthStrait1_title = Destroy the FOB near the Southern Strait
		#loc_KUM_kumGroundFobSouthStrait1_desc = We have located one of the enemy's bases! Our intel points to the strait close to the southern ice shelf, it is recommend to pack extra layers for the cold.\nDestroy the enemy outpost to secure Kerbin from their forces once more!\n\nNote a hostile aerial unit has been seen operating in the area previously as well.
		#loc_KUM_kumGroundFobSouthStrait1_synopsis = Destroy a hostile base in the strait close to the Southern Ice Cap.
		#loc_KUM_kumGroundFobSouthStrait1_completed = Mission accomplished! With the southern strait secured we can resume our ground operations in the area.

		#loc_KUM_kumGroundFobWaterfallMountains1_title = Destroy the FOB in the Waterfall Mountains
		#loc_KUM_kumGroundFobWaterfallMountains1_desc = One of the enemy's bases was located in the eastern peninsula's waterfall mountain range, north-east of the KSC. This is a high altitude location so be sure to prepare your intakes.\nTaking out the enemy here is a priority to ensure our ground forces can progress through the area, we are counting on you.
		#loc_KUM_kumGroundFobWaterfallMountains1_synopsis = Eliminate an enemy outpost located in the waterfall mountains area north-east of the KSC.
		#loc_KUM_kumGroundFobWaterfallMountains1_completed = Mission accomplished! Ground operations have successfully resumed in the area, our ground units have sent their regards.

		// Naval

		#loc_KUM_kumNavalRequired_title = Patrol Boats South-East of the KSC
		#loc_KUM_kumNavalRequired_desc = Two unidentified patrol boats were detected south-east of the KSC, they are actively denying shipping in the area and must be dealt with.\nIf possible, approach these vessels so that we can gather intelligence on their model and source.\n\nYou are authorized to use whichever measures necessary to destroy the vehicles.
		#loc_KUM_kumNavalRequired_synopsis = Analyze the patrol boats and stop their operations.
		#loc_KUM_kumNavalRequired_completed = Mission accomplished! The area has been secured.

		#loc_KUM_kumNavalIslandAirfield1_title = Naval Reinforcements near the Island Airfield
		#loc_KUM_kumNavalIslandAirfield1_desc = A small number of patrol boats have been spotted east of the KSC by the island airfied, our latest recon flight which was fired at reported 4 contacts.\nThe vessels have light armaments but they still pose a threat to our facilities.\n\nDestroy them and retrieve our sea!
		#loc_KUM_kumNavalIslandAirfield1_synopsis = Destroy the naval reinforcements near the island airfield.
		#loc_KUM_kumNavalIslandAirfield1_completed = Mission accomplished! The airfield area has been cleared of naval threats.

		//Space

		#loc_KUM_kumSpaceRequired_title = Surveillance Satellite
		#loc_KUM_kumSpaceRequired_desc = An unarmed surveillance satellite has recently been tracked, we have confirmed it carries a large dish, likely used for SIGINT. Approach the target then examine and destroy it.
		#loc_KUM_kumSpaceRequired_synopsis = Eliminate a SIGINT satellite in orbit.
		#loc_KUM_kumSpaceRequired_completed = Mission accomplished! We have intercepted the hostile communications network, expect to hear more shortly.

		#loc_KUM_kumSpaceSatellite1_title = Hostile Satellite
		#loc_KUM_kumSpaceSatellite1_desc = A potentially armed hostile surveillance satellite has recently been tracked, it maintains the enemy's communications network and poses a serious threat to any vehicles in the orbital plane it occupies therefore it must be dealt with immediately.\n\nEliminate the hostile SIGINT satellite.
		#loc_KUM_kumSpaceSatellite1_synopsis = Eliminate a hostile satellite in orbit.
		#loc_KUM_kumSpaceSatellite1_completed = Mission accomplished! The orbital plane has been cleared.

		#loc_KUM_kumSpaceEkv1_title = Malfunctioning Exoatmospheric Kill Vehicle
		#loc_KUM_kumSpaceEkv1_desc = A hostile exoatmospheric kill vehicle has recently malfunctioned during a weapons test, due to the nature of its presence in space it must be dealt with immediately.\n\nThe unit will target whatever approaches it, spare no caution in its immediate destruction.
		#loc_KUM_kumSpaceEkv1_synopsis = Eliminate a defective EKV in orbit.
		#loc_KUM_kumSpaceEkv1_completed = Mission accomplished! The threat has been eliminated and operations can resume.
	}
}
