		#loc_KUM_kumTestMissionStatic1_synopsis = Test some hardware while destroying a static target.
		#loc_KUM_kumTestMissionStatic1_completed = Success! The staff at our facility is overjoyed with the data!

		#loc_KUM_kumTestMissionSubmarine1_title = Destroy a submarine target
		#loc_KUM_kumTestMissionSubmarine1_desc = It has recently come to our attention that we have many weapons lying around, some which we cannot even confirm are still functional, that's where you come in.
