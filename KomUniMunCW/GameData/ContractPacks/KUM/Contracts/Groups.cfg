		// Late - late coldwar
		// Standard - contemporary/fictional

		// periodList = ["Early", "Mid", "Late", "Standard"]

		// For now keep this, next update should have Early as well
		periodList = ["Mid", "Late", "Standard"]
	}

	CONTRACT_GROUP
	{
		name = munistorumConventional
		displayName = #loc_KUM_Group_munistorumConventional_displayName

		agent = Komnenus Universalis Munistorum

		minVersion = 1.15.0

		maxCompletions = 0
		maxSimultaneous = 0

		CONTRACT_GROUP
		{
			name = munistorumAerial
			displayName = #loc_KUM_Group_munistorumAerial_displayName

			agent = Komnenus Universalis Munistorum

			minVersion = 1.15.0

			maxCompletions = 0
			maxSimultaneous = 22

			DATA
			{
				type = List<string>

				// Fighters

				midFightersBase   = [@/KUM:shipBase + "mid/fighter_01a.craft"]
				midFightersExtras = ["_lead"]
				midFighters       = @midFightersBase.Concat(@midFightersExtras.Exclude("_lead"))

				lateFightersBase   = [@/KUM:shipBase + "late/fighter_01a.craft"]
				lateFightersExtras = ["_lead"]
				lateFighters       = @lateFightersBase.Concat(@lateFightersExtras.Exclude("_lead"))

				standardFightersBase   = [@/KUM:shipBase + "standard/fighter_01a.craft"]
				standardFightersExtras = ["_lead"]
				standardFighters       = @standardFightersBase.Concat(@standardFightersExtras.Exclude("_lead"))

				// Strikers

				midStrikersBase   = []
				midStrikersExtras = ["_lead"]
				midStrikers       = @midStrikersBase.Concat(@midStrikersExtras.Exclude("_lead"))

				lateStrikersBase   = []
				lateStrikersExtras = ["_lead"]
				lateStrikers       = @lateStrikersBase.Concat(@lateStrikersExtras.Exclude("_lead"))

				standardStrikersBase   = []
				standardStrikersExtras = ["_lead"]
				standardStrikers       = @standardStrikersBase.Concat(@standardStrikersExtras.Exclude("_lead"))

				// Bombers

				midBombersBase   = []
				midBombersExtras = ["_lead"]
				midBombers       = @midBombersBase.Concat(@midBombersExtras.Exclude("_lead"))

				lateBombersBase   = []
				lateBombersExtras = ["_lead"]
				lateBombers       = @lateBombersBase.Concat(@lateBombersExtras.Exclude("_lead"))

				standardBombersBase   = []
				standardBombersExtras = ["_lead"]
				standardBombers       = @standardBombersBase.Concat(@standardBombersExtras.Exclude("_lead"))

				// Recon

				midReconBase   = []
				midReconExtras = ["_lead"]
				midRecon       = @midReconBase.Concat(@midReconExtras.Exclude("_lead"))

				lateReconBase   = []
				lateReconExtras = ["_lead"]
				lateRecon       = @lateReconBase.Concat(@lateReconExtras.Exclude("_lead"))

				standardReconBase   = []
				standardReconExtras = ["_lead"]
				standardRecon       = @standardReconBase.Concat(@standardReconExtras.Exclude("_lead"))

				// Helicopters (mid onwards)

				midHelicoptersBase   = []
				midHelicoptersExtras = ["_lead"]
				midHelicopters       = @midHelicoptersBase.Concat(@midHelicoptersExtras.Exclude("_lead"))

				lateHelicoptersBase   = []
				lateHelicoptersExtras = ["_lead"]
				lateHelicopters       = @lateHelicoptersBase.Concat(@lateHelicoptersExtras.Exclude("_lead"))

				standardHelicoptersBase   = []
				standardHelicoptersExtras = ["_lead"]
				standardHelicopters       = @standardHelicoptersBase.Concat(@standardHelicoptersExtras.Exclude("_lead"))

				// AWACS

				lateAWACSBase   = [@/KUM:shipBase + "late/awacs_01a.craft"]
				lateAWACSExtras = ["_lead"]
				lateAWACS       = @lateAWACSBase.Concat(@lateAWACSExtras.Exclude("_lead"))

				standardAWACSBase   = [@/KUM:shipBase + "standard/awacs_01a.craft"]
				standardAWACSExtras = ["_lead"]
				standardAWACS       = @standardAWACSBase.Concat(@standardAWACSExtras.Exclude("_lead"))

				// UAV

				lateUAVsBase   = [@/KUM:shipBase + "late/uav_01a.craft"]
				lateUAVsExtras = ["_lead"]
				lateUAVs       = @lateUAVsBase.Concat(@lateUAVsExtras.Exclude("_lead"))

				standardUAVsBase   = [@/KUM:shipBase + "standard/uav_01a.craft"]
				standardUAVsExtras = ["_lead"]
				standardUAVs       = @standardUAVsBase.Concat(@standardUAVsExtras.Exclude("_lead"))
			}
		}
	}

