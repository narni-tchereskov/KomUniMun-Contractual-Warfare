CONTRACT_TYPE
{
	name = kumTestSatellite1

	title = @locTitle + " (" + @/orbitBody + ")"
	genericTitle = @locTitle

	group = munistorumTest
	agent = Komnenus Universalis Munistorum

	description = @locDescription
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumTestSatellite1_synopsis

	completedMessage = #loc_KUM_kumTestSatellite1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	prestige = Trivial

	targetBody = @/orbitBody

	maxCompletions = 0
	maxSimultaneous = 4

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumTestSatellite1_title
		locDescription = #loc_KUM_kumTestSatellite1_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Is carrying an observer a parameter?
		carryObserverValue = Random(1, 5) == 1 ? 1 : 0

		// Is part testing a parameter?
		partTestValue = Random(0,1)

		// Is recovery necessary?
		needRecoverValue = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetVessel = @/KUM:locVesselTargetSatellite + " " + @/KUM:locSTGT + @/nameAppend
	}

	DATA
	{
		type = AvailablePart

		// Test Part
		testPart = AllParts().Where(b => b.IsUnlocked() && (b.Description().Contains("EKV-Testable") || b.Description().Contains("CNN-Testable"))).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = Random(1.5, 3.5)
		reputation = 0.0 // Must be greater or equal to 0
		funds = 8000.0 * Random(0.8, 3.1)
	}

	DATA
	{
		type = CelestialBody

		// Planet
		orbitBody = OrbitedBodies().Where(b => b.IsHomeWorld() || (b.IsMoon() && b.Parent().IsHomeWorld())).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Minimum orbit parameter avoids terrain, raw maximum avoids encounters
		safeMinRadius = @/orbitBody.Radius() + @/orbitBody.SpaceAltitudeThreshold()
		rawMaxRadius = @/orbitBody.Children().Count() > 0 ? (@/orbitBody.Children().First().SemiMajorAxis() - (@/orbitBody.Children().First().SphereOfInfluence() * 1.2)) : (@/orbitBody.SphereOfInfluence() * 0.8)
		hidden = true
	}

	DATA
	{
		type = double

		// Maximum orbit parameter
		safeMaxRadius = Max(@/safeMinRadius, @/rawMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// Peri and Apo apses for SMA calculation
		orbitPeriapsis = Random(@/safeMinRadius, @/safeMaxRadius)
		orbitApoapsis = Random(@/orbitPeriapsis, @/safeMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// SMA and ECC values to avoid orbits outside body SOI
		orbitSMA = (@/orbitPeriapsis + @/orbitApoapsis) / 2.0
		orbitECC = (@/orbitApoapsis - @/orbitPeriapsis) / (@/orbitApoapsis + @/orbitPeriapsis)
		hidden = true
	}

	DATA
	{
		type = Kerbal

		// The observer
		observerKerbal = NewKerbal()

		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnObserver
		type = KomUniMunSpawnPassengers

		count = @/carryObserverValue * @/needRecoverValue
		kerbal = @/observerKerbal
	}

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel
			craftURL = @/KUM:targetSatellite.Exclude("_lead").Random()
			flagURL = Squad/Flags/retro
			vesselType = Unknown
			owned = false
			targetBody = @/orbitBody

			ORBIT
			{
				SMA = @/orbitSMA
				ECC = @/orbitECC
				INC = Random(-180.0, 180.0)
				LPE = Random(0.0, 360.0)
				LAN = Random(0.0, 360.0)
				MNA = Random(0.0, 6.283185)
				EPH = UniversalTime()
			}
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel
	}

	// Fail the contract if the observer dies (if applicable)
	PARAMETER
	{
		name = ObserverDied
		type = KerbalDeaths

		title = #loc_KUM_test_ObserverDied
		kerbal = @/observerKerbal

		REQUIREMENT
		{
			name = CarryObserver
			type = Expression

			expression = (@/carryObserverValue * @/needRecoverValue) == 1
		}
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = TestingSequence
		type = Sequence

		title = @/KUM:locTestParamTestThe + " " + @/testPart + " " + @/KUM:locTestParamOnTargetOptional
		completedMessage = #loc_KUM_test_tests_complete

		rewardScience = (@/science * 0.5)
		rewardReputation = (@/reputation * 0.5)
		rewardFunds = (@/funds * 0.5)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		REQUIREMENT
		{
			name = Expression
			type = Expression

			expression = @/partTestValue == 1
		}

		PARAMETER
		{
			name = TestProcedure
			type = PartTest

			notes = #loc_KUM_test_run_after

			optional = true

			part = @/testPart

			PARAMETER
			{
				name = HasObserverTest
				type = HasPassengers

				title = #loc_KUM_test_HasObserverTest
				kerbal = @/observerKerbal

				REQUIREMENT
				{
					name = CarryObserver
					type = Expression

					expression = (@/carryObserverValue * @/needRecoverValue) == 1
				}
			}

			PARAMETER
			{
				name = HasTestPart
				type = PartValidation

				title = @/KUM:locTestParamHaveOne + " " + @/testPart + " " + @/KUM:locTestParamOnYourVehicle

				completeInSequence = true

				part = @/testPart
				minCount = 1
			}

			PARAMETER
			{
				name = RendezvousCraft
				type = Rendezvous

				title = #loc_KUM_test_param_approach_2km

				completeInSequence = true

				vessel = @/targetVessel

				disableOnStateChange = false

				distance = 2000.0
			}

			PARAMETER
			{
				name = DurationDelay
				type = Duration

				preWaitText = #loc_KUM_test_preWaitText
				waitingText = #loc_KUM_test_waitingText
				completionText = #loc_KUM_test_completionText

				completeInSequence = true

				duration = 20s

				startCriteria = PARAMETER_COMPLETION
				parameter = RendezvousCraft
			}
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_test_param_destroy_target

		PARAMETER
		{
			name = HasObserverCombat
			type = HasPassengers

			title = #loc_KUM_test_HasObserverCombat
			kerbal = @/observerKerbal

			rewardScience = (@/science * 0.5)
			rewardReputation = (@/reputation * 0.5)
			rewardFunds = (@/funds * 0.5)

			REQUIREMENT
			{
				name = CarryObserver
				type = Expression

				expression = (@/carryObserverValue * @/needRecoverValue) == 1
			}
		}

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_test_param_destroy_satellite

			completeInSequence = true

			vessel = @/targetVessel
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_test_stop_testbed

			completeInSequence = true

			REQUIREMENT
			{
				name = NeedLand
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_test_testbed_recovered

			completeInSequence = true

			REQUIREMENT
			{
				name = NeedRecover
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}
	}
}
