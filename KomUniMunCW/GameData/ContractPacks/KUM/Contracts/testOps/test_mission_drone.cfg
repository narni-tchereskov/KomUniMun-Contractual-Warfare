CONTRACT_TYPE
{
	name = kumTestMissionDrone1

	title = @locTitle
	genericTitle = @locTitle

	group = munistorumTestOps
	agent = Komnenus Universalis Munistorum

	description = @locDescription + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumTestMissionDrone1_synopsis

	completedMessage = #loc_KUM_kumTestMissionDrone1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	prestige = Trivial

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 2

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumTestMissionDrone1_title
		locDescription = #loc_KUM_kumTestMissionDrone1_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Is carrying an observer a parameter?
		carryObserverValue = Random(1, 5) == 1 ? 1 : 0

		// Is part testing a parameter?
		partTestValue = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetVessel = @/KUM:locVesselTargetDrone + " " + @/KUM:locATGT + @/nameAppend
	}

	DATA
	{
		type = AvailablePart

		// Test Part
		testPart = AllParts().Where(b => b.IsUnlocked() && (b.Description().Contains("AAM-Testable") || b.Description().Contains("CNN-Testable"))).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 2.0 * (Random(0.8, 2.5) * Pow(2, 0.333333))
		reputation = 4.0 * (Random(0.8, 2.5) * Pow(2, 0.333333))
		funds = 4000.0 * (Random(0.8, 2.5) * Pow(2, 0.333333))

		// Vehicle Coordinates
		squadLat = Random(-8.2, 7.6)
		squadLon = Random(-84.2, -57.0)
		squadAlt = 10000.0
		squadHdg = 0

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	DATA
	{
		type = Kerbal

		// The observer
		observerKerbal = NewKerbal()

		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnObserver
		type = KomUniMunSpawnPassengers

		count = @/carryObserverValue
		kerbal = @/observerKerbal
	}

	BEHAVIOUR
	{
		name = SpawnTarget
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel
			craftURL = @/KUM:targetDrones.Exclude("_lead").Random()
			flagURL = Squad/Flags/retro
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			alt = @/squadAlt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel
	}

	// Fail the contract if the observer dies (if applicable)
	PARAMETER
	{
		name = ObserverDied
		type = KerbalDeaths

		title = #loc_KUM_test_ObserverDied
		kerbal = @/observerKerbal

		REQUIREMENT
		{
			name = CarryObserver
			type = Expression

			expression = @/carryObserverValue == 1
		}
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = TestingSequence
		type = Sequence

		title = @/KUM:locTestParamTestThe + " " + @/testPart + " " + @/KUM:locTestParamOnTargetOptional
		completedMessage = #loc_KUM_test_tests_complete

		rewardScience = (@/science * 0.5)
		rewardReputation = (@/reputation * 0.5)
		rewardFunds = (@/funds * 0.5)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		REQUIREMENT
		{
			name = Expression
			type = Expression

			expression = @/partTestValue == 1
		}

		PARAMETER
		{
			name = TestProcedure
			type = PartTest

			notes = #loc_KUM_test_run_after

			optional = true

			part = @/testPart

			PARAMETER
			{
				name = HasObserverTest
				type = HasPassengers

				title = #loc_KUM_test_HasObserverTest
				kerbal = @/observerKerbal

				REQUIREMENT
				{
					name = CarryObserver
					type = Expression

					expression = @/carryObserverValue == 1
				}
			}

			PARAMETER
			{
				name = HasTestPart
				type = PartValidation

				title = @/KUM:locTestParamHaveOne + " " + @/testPart + " " + @/KUM:locTestParamOnYourVehicle

				completeInSequence = true

				part = @/testPart
				minCount = 1
			}

			PARAMETER
			{
				name = RendezvousCraft
				type = Rendezvous

				title = #loc_KUM_test_param_approach_500m

				completeInSequence = true

				vessel = @/targetVessel

				disableOnStateChange = false

				distance = 500.0
			}

			PARAMETER
			{
				name = DurationDelay
				type = Duration

				preWaitText = #loc_KUM_test_preWaitText
				waitingText = #loc_KUM_test_waitingText
				completionText = #loc_KUM_test_completionText

				completeInSequence = true

				duration = 20s

				startCriteria = PARAMETER_COMPLETION
				parameter = RendezvousCraft
			}
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_test_param_destroy_target

		PARAMETER
		{
			name = HasObserverCombat
			type = HasPassengers

			title = #loc_KUM_test_HasObserverCombat
			kerbal = @/observerKerbal

			rewardScience = (@/science * 0.5)
			rewardReputation = (@/reputation * 0.5)
			rewardFunds = (@/funds * 0.5)

			REQUIREMENT
			{
				name = CarryObserver
				type = Expression

				expression = @/carryObserverValue == 1
			}
		}

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_test_param_destroy_drone

			completeInSequence = true

			vessel = @/targetVessel
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_test_stop_testbed

			completeInSequence = true
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_test_testbed_recovered

			completeInSequence = true
		}
	}
}
