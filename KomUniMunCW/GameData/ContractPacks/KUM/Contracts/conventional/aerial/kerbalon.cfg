CONTRACT_TYPE
{
	name = kumAirKerbalonPixy

	title = @locTitle
	genericTitle = @locTitle

	group = munistorumAerial
	agent = Komnenus Universalis Munistorum

	description = @locDescription + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon + @/KUM:recoveryLocations
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumAirKerbalonPixy_synopsis

	completedMessage = #loc_KUM_kumAirKerbalonPixy_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumAirKerbalonPixy_title
		locDescription = #loc_KUM_kumAirKerbalonPixy_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetAircraft = @/KUM:locVesselSPAircraft + " " + @/KUM:locAIR + @/nameAppend
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 10 * Random(0.8, 2.0)
		funds = 10000 * Random(0.8, 1.2)

		// Vehicle Coordinates
		squadLat = Random(45.0, 46.0)
		squadLon = Random(-141.5, -141.5)
		squadAlt = 10000.0
		squadHdg = 0

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumAirKerbalonPlains1
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumAirKerbalonTundra3
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnAircraft
		type = SpawnVessel

		VESSEL
		{
			name = @/targetAircraft
			craftURL = @/KUM:shipBase + "standard/sp_fighter_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			alt = @/squadAlt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetAircraft
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
