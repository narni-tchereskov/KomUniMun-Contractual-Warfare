			underwater = false

			targetBody = HomeWorld()

			latitude = 38.56
			longitude = -140.42
			altitude = 0.0
		}
	}

	// Parameters for completing the contract

	PARAMETER
	{
		name = ApproachSequence
		type = Sequence

		title = #loc_KUM_param_river_pixy

		failWhenCompleteOutOfOrder = true

		PARAMETER
		{
			name = Entrance
			type = VisitWaypoint

			index = 9
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = Progress1
			type = VisitWaypoint

			index = 10
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = Progress2
			type = VisitWaypoint

			index = 11
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = Progress3
			type = VisitWaypoint

			index = 12
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = Progress4
			type = VisitWaypoint

			index = 13
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = Exit
			type = VisitWaypoint

			index = 14
			distance = 2000.0

			disableOnStateChange = true
			hideOnCompletion = true
		}

		PARAMETER
		{
			name = RiverAltitudeCheck
			type = AtMost

			title = #loc_KUM_param_alt_pixy

			count = 1
			completeInSequence = true

			PARAMETER
			{
				name = EntranceChecker
				type = VisitWaypoint

				index = 9
				distance = 2000.0

				hidden = true

				disableOnStateChange = true
				hideOnCompletion = true
			}

			PARAMETER
			{
				name = ReachState
				type = ReachState

				hidden = true

				minAltitude = 250
			}
		}

		// Combat parameters
		PARAMETER
		{
			name = CombatSequence
			type = Sequence

			title = #loc_KUM_common_engage_units

			PARAMETER
			{
				name = DestroyCraft
				type = TargetDestroyed

				title = #loc_KUM_common_eliminate_hostile

				vessel = @/targetAircraft
			}

			// Parameters for recovering the vessel after the mission
			PARAMETER
			{
				name = LandBase
				type = ReturnHome

				title = #loc_KUM_common_stop_vessel

				completeInSequence = true
			}

			PARAMETER
			{
				name = AnyBase
				type = Any

				title = #loc_KUM_common_return_ksc

				disableOnStateChange = false
				completeInSequence = true
				hideChildren = true

				PARAMETER
				{
					name = isInKsc
					type = VisitWaypoint

					index = 0
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInIsland
					type = VisitWaypoint

					index = 1
