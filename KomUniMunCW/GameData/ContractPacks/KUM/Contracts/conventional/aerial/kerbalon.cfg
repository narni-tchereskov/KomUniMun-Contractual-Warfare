				}

				PARAMETER
				{
					name = isInInland
					type = VisitWaypoint

					index = 2
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInGlacier
					type = VisitWaypoint

					index = 3
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInCove
					type = VisitWaypoint

					index = 4
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInCrater
					type = VisitWaypoint

					index = 5
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInMahi
					type = VisitWaypoint

					index = 6
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInDessert
					type = VisitWaypoint

					index = 7
					distance = 2000.0
				}

				PARAMETER
				{
					name = isInWoomerang
					type = VisitWaypoint

					index = 8
					distance = 2000.0
				}
			}

			PARAMETER
			{
				name = RecoverBase
				type = RecoverVessel

				title = #loc_KUM_common_recover_vessel
				completedMessage = #loc_KUM_common_vessel_recovered

				completeInSequence = true
			}
		}
	}
}
