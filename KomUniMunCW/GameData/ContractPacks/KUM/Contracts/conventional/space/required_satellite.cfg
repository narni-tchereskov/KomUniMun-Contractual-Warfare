CONTRACT_TYPE
{
	name = kumSpaceRequired

	title = @locTitle + " (" + @/orbitBody + ")"
	genericTitle = @locTitle

	group = munistorumSpace
	agent = Komnenus Universalis Munistorum

	description = @locDescription
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumSpaceRequired_synopsis

	completedMessage = #loc_KUM_kumSpaceRequired_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = @/orbitBody

	maxCompletions = 1
	maxSimultaneous = 1

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumSpaceRequired_title
		locDescription = #loc_KUM_kumSpaceRequired_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Is recovery necessary?
		needRecoverValue = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetVessel = @/KUM:locVesselUnidentified + " " + @/KUM:locVesselSIGINT + " " + @/KUM:locVesselSatellite + " " + @/KUM:locSPC + @/nameAppend
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 9.0 * (Random(0.8, 2.5) * Pow(2, 0.333333))
		funds = 9000.0 * (Random(0.8, 2.5) * Pow(2, 0.333333))
	}

	DATA
	{
		type = CelestialBody

		// Planet
		orbitBody = OrbitedBodies().Where(b => !b.IsSun()).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Minimum orbit parameter avoids terrain, raw maximum avoids encounters
		safeMinRadius = @/orbitBody.Radius() + @/orbitBody.SpaceAltitudeThreshold()
		rawMaxRadius = @/orbitBody.Children().Count() > 0 ? (@/orbitBody.Children().First().SemiMajorAxis() - (@/orbitBody.Children().First().SphereOfInfluence() * 1.2)) : (@/orbitBody.SphereOfInfluence() * 0.8)
		hidden = true
	}

	DATA
	{
		type = double

		// Maximum orbit parameter
		safeMaxRadius = Max(@/safeMinRadius, @/rawMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// Peri and Apo apses for SMA calculation
		orbitPeriapsis = Random(@/safeMinRadius, @/safeMaxRadius)
		orbitApoapsis = Random(@/orbitPeriapsis, @/safeMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// SMA and ECC values to avoid orbits outside body SOI
		orbitSMA = (@/orbitPeriapsis + @/orbitApoapsis) / 2.0
		orbitECC = (@/orbitApoapsis - @/orbitPeriapsis) / (@/orbitApoapsis + @/orbitPeriapsis)
		hidden = true
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel
			craftURL = "ContractPacks/KUM/Assets/Ships/Fueled/special/sp_satellite_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = @/orbitBody

			ORBIT
			{
				SMA = @/orbitSMA
				ECC = @/orbitECC
				INC = Random(-180.0, 180.0)
				LPE = Random(0.0, 360.0)
				LAN = Random(0.0, 360.0)
				MNA = Random(0.0, 6.283185)
				EPH = UniversalTime()
			}
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
			name = glacierWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 73.5615
			longitude = 84.2474
			altitude = 0.0
		}

		WAYPOINT
		{
			name = coveWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 3.7476
			longitude = -72.2132
			altitude = 0.0
		}

		WAYPOINT
		{
			name = craterWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 8.3859
			longitude = -179.6977
			altitude = 0.0
		}

		WAYPOINT
		{
			name = mahiWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -49.8024
			longitude = -120.7659
			altitude = 0.0
		}

		WAYPOINT
		{
			name = dessertWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -6.5798
			longitude = -143.9952
			altitude = 822.5
		}

		WAYPOINT
		{
			name = woomerangWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 45.29
			longitude = 136.11
			altitude = 739.0
		}
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = IdentificationSequence
		type = Sequence

		title = #loc_KUM_param_ident
		completedMessage = #loc_KUM_msg_ident

		rewardReputation = (@/reputation * 2)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		PARAMETER
		{
			name = RendezvousCraft
			type = Rendezvous

			title = @/KUM:locParamAppr + " " + @/targetVessel + " " + @/KUM:locTestParamWithin2km

			vessel = @/targetVessel

			disableOnStateChange = false

			distance = 100.0
		}

		PARAMETER
		{
			name = DurationDelay
			type = Duration

			preWaitText = #loc_KUM_ident_preWaitText
			waitingText = #loc_KUM_ident_waitingText
			completionText = #loc_KUM_ident_completionText

			completeInSequence = true

			duration = 10s

			startCriteria = PARAMETER_COMPLETION
			parameter = RendezvousCraft
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_common_engage_units

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_common_eliminate_unidentified

			vessel = @/targetVessel
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_common_stop_vessel

			completeInSequence = true
		}

		PARAMETER
		{
			name = AnyBase
			type = Any

			title = #loc_KUM_common_return_ksc

			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true

			PARAMETER
			{
				name = isInKsc
				type = VisitWaypoint

				index = 0
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInIsland
				type = VisitWaypoint

				index = 1
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInInland
				type = VisitWaypoint

				index = 2
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInGlacier
				type = VisitWaypoint

				index = 3
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCove
				type = VisitWaypoint

				index = 4
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCrater
				type = VisitWaypoint

				index = 5
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInMahi
				type = VisitWaypoint

				index = 6
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInDessert
				type = VisitWaypoint

				index = 7
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInWoomerang
				type = VisitWaypoint

				index = 8
				distance = 2000.0
			}

			REQUIREMENT
			{
				name = NeedLand
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_common_vessel_recovered

			completeInSequence = true

			REQUIREMENT
			{
				name = NeedRecover
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}
	}
}
