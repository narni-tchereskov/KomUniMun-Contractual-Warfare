CONTRACT_TYPE
{
	name = kumGroundRequired

	title = @locTitle + " (" + @titlePeriod + ")"
	genericTitle = @locTitle

	group = munistorumGround
	agent = Komnenus Universalis Munistorum

	description = @locDescription + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon + @/KUM:recoveryLocations
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumGroundRequired_synopsis

	completedMessage = #loc_KUM_kumGroundRequired_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumGroundRequired_title
		locDescription = #loc_KUM_kumGroundRequired_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Period of mission
		periodSelector = Random(0,3)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels
		titlePeriod = @/KUM:periodList.ElementAt(@/periodSelector)

		// Target Names
		targetArtillery1 = @/KUM:locVesselArtillery + " 1 " + @/KUM:locGND + @/nameAppend
		targetArtillery2 = @/KUM:locVesselArtillery + " 2 " + @/KUM:locGND + @/nameAppend
	}

	DATA
	{
		type = List<string>

		// Vehicle Lists
		artilleryList = @/periodSelector == 0 ? @/KUM:earlyArtillery : (@/periodSelector == 1 ? @/KUM:midArtillery : (@/periodSelector == 2 ? @/KUM:lateArtillery : @/KUM:standardArtillery))
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 5.5 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))
		funds = 5500.0 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))

		// Vehicle Coordinates
		squadLat = Random(-1.3, 0.3)
		squadLon = Random(-78.0, -75.5)
		squadHgt = 5.0
		squadHdg = Random(87.5, 92.5)

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetArtillery1
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat + 0.002
			lon = @/squadLon
			height = @/squadHgt

			heading = @/squadHdg - 2.5
		}

		VESSEL
		{
			name = @/targetArtillery2
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.002
			lon = @/squadLon
			height = @/squadHgt

			heading = @/squadHdg + 2.5
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetArtillery1
		vessel = @/targetArtillery2
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
			name = glacierWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 73.5615
			longitude = 84.2474
			altitude = 0.0
		}

		WAYPOINT
		{
			name = coveWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 3.7476
			longitude = -72.2132
			altitude = 0.0
		}

		WAYPOINT
		{
			name = craterWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 8.3859
			longitude = -179.6977
			altitude = 0.0
		}

		WAYPOINT
		{
			name = mahiWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -49.8024
			longitude = -120.7659
			altitude = 0.0
		}

		WAYPOINT
		{
			name = dessertWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -6.5798
			longitude = -143.9952
			altitude = 822.5
		}

		WAYPOINT
		{
			name = woomerangWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 45.29
			longitude = 136.11
			altitude = 739.0
		}
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = IdentificationSequence
		type = Sequence

		title = #loc_KUM_param_ident
		completedMessage = #loc_KUM_msg_ident

		rewardReputation = (@/reputation * 2)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		PARAMETER
		{
			name = RendezvousCraft
			type = Rendezvous

			title = @/KUM:locParamAppr + " " + @/targetArtillery1 + " " + @/KUM:locTestParamWithin2km

			vessel = @/targetArtillery1

			disableOnStateChange = false

			distance = 2000.0
		}

		PARAMETER
		{
			name = DurationDelay
			type = Duration

			preWaitText = #loc_KUM_ident_preWaitText
			waitingText = #loc_KUM_ident_waitingText
			completionText = #loc_KUM_ident_completionText

			completeInSequence = true

			duration = 10s

			startCriteria = PARAMETER_COMPLETION
			parameter = RendezvousCraft
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_common_engage_units

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_common_eliminate_unidentified

			vessel = @/targetArtillery1
			vessel = @/targetArtillery2
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_common_stop_vessel

			completeInSequence = true
		}

		PARAMETER
		{
			name = AnyBase
			type = Any

			title = #loc_KUM_common_return_ksc

			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true

			PARAMETER
			{
				name = isInKsc
				type = VisitWaypoint

				index = 0
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInIsland
				type = VisitWaypoint

				index = 1
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInInland
				type = VisitWaypoint

				index = 2
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInGlacier
				type = VisitWaypoint

				index = 3
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCove
				type = VisitWaypoint

				index = 4
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCrater
				type = VisitWaypoint

				index = 5
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInMahi
				type = VisitWaypoint

				index = 6
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInDessert
				type = VisitWaypoint

				index = 7
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInWoomerang
				type = VisitWaypoint

				index = 8
				distance = 2000.0
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_common_vessel_recovered

			completeInSequence = true
		}
	}
}
