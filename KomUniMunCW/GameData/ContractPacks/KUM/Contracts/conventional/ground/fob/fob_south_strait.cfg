CONTRACT_TYPE
{
	name = kumGroundFobSouthStrait1

	title =
	genericTitle =

	group = munistorumFob
	agent = komUniMun

	description =
	genericDescription =

	topic = Weapons
	subject = Experiment

	synopsis =

	completedMessage =

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	// Data node for the rewards
	DATA
	{
		type = double

		science = 0.0 // Zero for non-test missions
		reputation = 13 * Random(0.8, 1.2)
		funds = 28000 * Random(0.8, 1.2)
	}

	// Name Safety
	DATA
	{
		type = int

		nameAppend = Random(0, 65535)

		hidden = true
	}

	// Target Names
	DATA
	{
		type = string
		title = "Target vessels"

		targetFOB = "FOB 1" + @/nameAppend

		targetHowitzer1 = "Howitzer 1" + @/nameAppend
		targetHowitzer2 = "Howitzer 2" + @/nameAppend

		targetAAA1 = "AAA 1" + @/nameAppend
		targetAAA2 = "AAA 2" + @/nameAppend

		targetCIWS = "CIWS 1" + @/nameAppend

		targetSAM = "SAM 1" + @/nameAppend
		targetRadar = "Radar 1" + @/nameAppend
	}

	// Vehicle Lists
	DATA
	{
		type = List<string>

		baseList = @/munistorumDataStore:baseList.Concat(@/munistorumDataStore:outpostList)

		howitzerList = @/munistorumDataStore:howitzerList.Concat(@/munistorumDataStore:coastHowitzerList)

		radarList = @/munistorumDataStore:radarList.Concat(@/munistorumDataStore:spradStaticList)
		samList = @/munistorumDataStore:samList.Concat(@/munistorumDataStore:spadStaticList)
		aaaList = @/munistorumDataStore:aaaList.Concat(@/munistorumDataStore:spaagStaticList)
		ciwsList = @/munistorumDataStore:ciwsList
	}

	// Vehicle Positions
	DATA
	{
		type = double

		squadLat = Random(-54.0, -48.2)
		squadLon = Random(114.5, 121.4)
		squadHdg = Random(0.0, 360.0)
	}

	// Title Coordinates
	DATA
	{
		type = double

		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	// Requirement node for contract prerequisites
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredFob
	}

	// Value definitions
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4
	
	// Behaviour such as vessel location, name etc

	// FOB
	BEHAVIOUR
	{
		name = SpawnFOB
		type = SpawnVessel
		deferVesselCreation = true

		VESSEL
		{
			name = @/targetFOB
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/baseList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			height = 5

			heading = @/squadHdg
		}
	}

	// Howitzers
	BEHAVIOUR
	{
		name = SpawnHowitzer
		type = SpawnVessel
		deferVesselCreation = true

		VESSEL
		{
			name = @/targetHowitzer1
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/howitzerList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat + 0.2
			lon = @/squadLon
			height = 5

			heading = 0.0
		}

		VESSEL
		{
			name = @/targetHowitzer2
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/howitzerList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.2
			lon = @/squadLon

			height = 5

			heading = 180.0
		}
	}

	// AAA
	BEHAVIOUR
	{
		name = SpawnAAA
		type = SpawnVessel
		deferVesselCreation = true

		VESSEL
		{
			name = @/targetAAA1
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/aaaList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon + 0.2
			height = 5

			heading = 90.0
		}

		VESSEL
		{
			name = @/targetAAA2
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/aaaList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon - 0.2
			height = 5

			heading = 270.0
		}
	}

	// CIWS
	BEHAVIOUR
	{
		name = SpawnCIWS
		type = SpawnVessel
		deferVesselCreation = true

		VESSEL
		{
			name = @/targetCIWS
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/ciwsList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.2
			lon = @/squadLon - 0.2
			height = 5

			heading = @/squadHdg
		}
	}

	// SAM
	BEHAVIOUR
	{
		name = SpawnSAM
		type = SpawnVessel
		deferVesselCreation = true

		VESSEL
		{
			name = @/targetSAM
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat + 0.2
			lon = @/squadLon + 0.2
			height = 5

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetRadar
			craftURL = "ContractPacks/KUM/Assets/Ships/" + @/radarList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat + 0.2 + 0.002
			lon = @/squadLon + 0.2 + 0.002
			height = 5

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = PARAMETER_COMPLETED
		parameter = DestroyCraft

		vessel = @/targetFOB

		vessel = @/targetHowitzer1
		vessel = @/targetHowitzer2

		vessel = @/targetAAA1
		vessel = @/targetAAA2

		vessel = @/targetCIWS

		vessel = @/targetSAM
		vessel = @/targetRadar
	}

	// Parameters for completing the contract

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = "Eliminate the enemy"

		hiddenParameter = DestroyCraft

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = "Eliminate the enemy"

			vessel = @/targetFOB

			vessel = @/targetHowitzer1
			vessel = @/targetHowitzer2

			vessel = @/targetAAA1
			vessel = @/targetAAA2

			vessel = @/targetCIWS

			vessel = @/targetSAM
			vessel = @/targetRadar
		}

		// Parameter for recovering the vessel after the mission
		PARAMETER
		{
			name = ToBase
			type = All

			title = "Land the vessel and recover it safely on Kerbin"

			disableOnStateChange = true
			completeInSequence = true

			PARAMETER
			{
				name = LandBase
				type = ReturnHome

				title = "Stop the vessel on the surface"
			}

			PARAMETER
			{
				name = RecoverBase
				type = RecoverVessel

				title = "Recover the vessel"
				completedMessage = "The vessel was successfully recovered!"
			}
		}
	}
}
