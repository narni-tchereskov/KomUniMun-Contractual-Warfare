CONTRACT_TYPE
{
	name = kumGroundCraterRim1

	title = @locTitle + " (" + @titlePeriod + ")"
	genericTitle = @locTitle

	group = munistorumGround
	agent = Komnenus Universalis Munistorum

	description = @locDescription + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon + @/KUM:recoveryLocations
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumGroundCraterRim1_synopsis

	completedMessage = #loc_KUM_kumGroundCraterRim1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumGroundCraterRim1_title
		locDescription = #loc_KUM_kumGroundCraterRim1_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Period of mission
		periodSelector = Random(0,2)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels
		titlePeriod = @/KUM:periodList.ElementAt(@/periodSelector)

		// Target Names
		targetSAM1 = @/KUM:locVesselSAM + " 1 " + @/KUM:locGND + @/nameAppend
		targetSAM2 = @/KUM:locVesselSAM + " 2 " + @/KUM:locGND + @/nameAppend
		targetSAM3 = @/KUM:locVesselSAM + " 3 " + @/KUM:locGND + @/nameAppend
		targetSAM4 = @/KUM:locVesselSAM + " 4 " + @/KUM:locGND + @/nameAppend
		targetSAM5 = @/KUM:locVesselSAM + " 5 " + @/KUM:locGND + @/nameAppend
	}

	DATA
	{
		type = List<string>

		// Vehicle Lists
		samList = @/periodSelector == 0 ? @/KUM:midSAMs : (@/periodSelector == 1 ? @/KUM:lateSAMs : @/KUM:standardSAMs)
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 10.0 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))
		funds = 10000.0 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))

		// Vehicle Coordinates
		sam1Lat = 9.297778
		sam1Lon = -172.183056
		sam1Hdg = 270.0

		sam2Lat = 1.005278
		sam2Lon = -176.543056
		sam2Hdg = 345.0

		sam3Lat = 1.724167
		sam3Lon = 175.400833
		sam3Hdg = 15.0

		sam4Lat = 12.521389
		sam4Lon = 172.668056
		sam4Hdg = 90.0

		sam5Lat = 8.310712
		sam5Lon = 179.877643
		sam5Hdg = 180.0

		squadHgt = 5.0
		squadHdg = 0.0

		// Title Coordinates
		titleLat = Round(@sam1Lat)
		titleLon = Round(@sam1Lon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredGround
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetSAM1
			craftURL = @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/sam1Lat
			lon = @/sam1Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetSAM2
			craftURL = @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/sam2Lat
			lon = @/sam2Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetSAM3
			craftURL = @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/sam3Lat
			lon = @/sam3Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetSAM4
			craftURL = @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/sam4Lat
			lon = @/sam4Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetSAM5
			craftURL = @/samList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/sam5Lat
			lon = @/sam5Lon
			height = @/squadHgt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetSAM1
		vessel = @/targetSAM2
		vessel = @/targetSAM3
		vessel = @/targetSAM4
		vessel = @/targetSAM5
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
			name = glacierWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 73.5615
			longitude = 84.2474
			altitude = 0.0
		}

		WAYPOINT
		{
			name = coveWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 3.7476
			longitude = -72.2132
			altitude = 0.0
		}

		WAYPOINT
		{
			name = craterWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 8.3859
			longitude = -179.6977
			altitude = 0.0
		}

		WAYPOINT
		{
			name = mahiWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -49.8024
			longitude = -120.7659
			altitude = 0.0
		}

		WAYPOINT
		{
			name = dessertWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -6.5798
			longitude = -143.9952
			altitude = 822.5
		}

		WAYPOINT
		{
			name = woomerangWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 45.29
			longitude = 136.11
			altitude = 739.0
		}
	}

	// Parameters for completing the contract

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_common_engage_units

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_common_eliminate_hostiles

			vessel = @/targetSAM1
			vessel = @/targetSAM2
			vessel = @/targetSAM3
			vessel = @/targetSAM4
			vessel = @/targetSAM5
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_common_stop_vessel

			completeInSequence = true
		}

		PARAMETER
		{
			name = AnyBase
			type = Any

			title = #loc_KUM_common_return_ksc

			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true

			PARAMETER
			{
				name = isInKsc
				type = VisitWaypoint

				index = 0
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInIsland
				type = VisitWaypoint

				index = 1
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInInland
				type = VisitWaypoint

				index = 2
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInGlacier
				type = VisitWaypoint

				index = 3
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCove
				type = VisitWaypoint

				index = 4
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCrater
				type = VisitWaypoint

				index = 5
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInMahi
				type = VisitWaypoint

				index = 6
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInDessert
				type = VisitWaypoint

				index = 7
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInWoomerang
				type = VisitWaypoint

				index = 8
				distance = 2000.0
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_common_vessel_recovered

			completeInSequence = true
		}
	}
}
