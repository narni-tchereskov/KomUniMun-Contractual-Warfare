CONTRACT_TYPE
{
	name = kumGroundIslandAirfield1

	title = @locTitle + " (" + @titlePeriod + ")"
	genericTitle = @locTitle

	group = munistorumGround
	agent = Komnenus Universalis Munistorum

	description = @locDescription + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon + @/KUM:recoveryLocations
	genericDescription = @locDescription

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumGroundIslandAirfield1_synopsis

	completedMessage = #loc_KUM_kumGroundIslandAirfield1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	// Concatenation safety
	DATA
	{
		type = string
		hidden = true

		locTitle = #loc_KUM_kumGroundIslandAirfield1_title
		locDescription = #loc_KUM_kumGroundIslandAirfield1_desc
	}

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Period of mission
		periodSelector = Random(0,3)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels
		titlePeriod = @/KUM:periodList.ElementAt(@/periodSelector)

		// Target Names
		targetArtillery1 = @/KUM:locVesselArtillery + " 1 " + @/KUM:locGND + @/nameAppend
		targetArtillery2 = @/KUM:locVesselArtillery + " 2 " + @/KUM:locGND + @/nameAppend
		targetArtillery3 = @/KUM:locVesselArtillery + " 3 " + @/KUM:locGND + @/nameAppend
		targetArtillery4 = @/KUM:locVesselArtillery + " 4 " + @/KUM:locGND + @/nameAppend
		targetArtillery5 = @/KUM:locVesselArtillery + " 5 " + @/KUM:locGND + @/nameAppend
		targetArtillery6 = @/KUM:locVesselArtillery + " 6 " + @/KUM:locGND + @/nameAppend

		targetAAA1 = @/KUM:locVesselAAA + " 1 " + @/KUM:locGND + @/nameAppend
		targetAAA2 = @/KUM:locVesselAAA + " 2 " + @/KUM:locGND + @/nameAppend
		targetAAA3 = @/KUM:locVesselAAA + " 3 " + @/KUM:locGND + @/nameAppend
		targetAAA4 = @/KUM:locVesselAAA + " 4 " + @/KUM:locGND + @/nameAppend
	}

	DATA
	{
		type = List<string>

		// Vehicle Lists

		artilleryList = @/periodSelector == 0 ? @/KUM:earlyArtillery : (@/periodSelector == 1 ? @/KUM:midArtillery : (@/periodSelector == 2 ? @/KUM:lateArtillery : @/KUM:standardArtillery))
		aaaList = @/periodSelector == 0 ? @/KUM:earlyAAA : (@/periodSelector == 1 ? @/KUM:midAAA : (@/periodSelector == 2 ? @/KUM:lateAAA : @/KUM:standardAAA))
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 12.0 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))
		funds = 12000.0 * (Random(0.8, 2.5) * Pow((@/periodSelector + 1), 0.333333))

		// Vehicle Coordinates
		artillery1Lat = -2.298756
		artillery1Lon = -72.657038
		artillery1Hdg = 40.0

		artillery2Lat = -1.503315
		artillery2Lon = -71.816636
		artillery2Hdg = 50.0

		artillery3Lat = -1.518136
		artillery3Lon = -71.968147
		artillery3Hdg = 277.0

		artillery4Lat = -1.620935
		artillery4Lon = -71.702422
		artillery4Hdg = 90.0

		artillery5Lat = -1.511657
		artillery5Lon = -71.815134
		artillery5Hdg = 53.0

		artillery6Lat = -1.499843
		artillery6Lon = -71.822940
		artillery6Hdg = 4.0

		AAA1Lat = -1.578383
		AAA1Lon = -71.927414

		AAA2Lat = -1.535801
		AAA2Lon = -71.936339

		AAA3Lat = -1.518950
		AAA3Lon = -71.895580

		AAA4Lat = -1.758010
		AAA4Lon = -71.983383

		squadHgt = 5.0
		squadHdg = 0.0

		// Title Coordinates
		titleLat = Round(@artillery1Lat)
		titleLon = Round(@artillery1Lon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumGroundRequired
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetArtillery1
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery1Lat
			lon = @/artillery1Lon
			height = @/squadHgt

			heading = @/artillery1Hdg
		}

		VESSEL
		{
			name = @/targetArtillery2
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery2Lat
			lon = @/artillery2Lon
			height = @/squadHgt

			heading = @/artillery2Hdg
		}

		VESSEL
		{
			name = @/targetArtillery3
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery3Lat
			lon = @/artillery3Lon
			height = @/squadHgt

			heading = @/artillery3Hdg
		}

		VESSEL
		{
			name = @/targetArtillery4
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery4Lat
			lon = @/artillery4Lon
			height = @/squadHgt

			heading = @/artillery4Hdg
		}

		VESSEL
		{
			name = @/targetArtillery5
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery5Lat
			lon = @/artillery5Lon
			height = @/squadHgt

			heading = @/artillery5Hdg
		}

		VESSEL
		{
			name = @/targetArtillery6
			craftURL = @/artilleryList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/artillery6Lat
			lon = @/artillery6Lon
			height = @/squadHgt

			heading = @/artillery6Hdg
		}

		VESSEL
		{
			name = @/targetAAA1
			craftURL = @/aaaList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/AAA1Lat
			lon = @/AAA1Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetAAA2
			craftURL = @/aaaList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/AAA2Lat
			lon = @/AAA2Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetAAA3
			craftURL = @/aaaList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/AAA3Lat
			lon = @/AAA3Lon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetAAA4
			craftURL = @/aaaList.Exclude("_lead").Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/AAA4Lat
			lon = @/AAA4Lon
			height = @/squadHgt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetArtillery1
		vessel = @/targetArtillery2
		vessel = @/targetArtillery3
		vessel = @/targetArtillery4
		vessel = @/targetArtillery5
		vessel = @/targetArtillery6

		vessel = @/targetAAA1
		vessel = @/targetAAA2
		vessel = @/targetAAA3
		vessel = @/targetAAA4
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
			name = glacierWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 73.5615
			longitude = 84.2474
			altitude = 0.0
		}

		WAYPOINT
		{
			name = coveWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 3.7476
			longitude = -72.2132
			altitude = 0.0
		}

		WAYPOINT
		{
			name = craterWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 8.3859
			longitude = -179.6977
			altitude = 0.0
		}

		WAYPOINT
		{
			name = mahiWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -49.8024
			longitude = -120.7659
			altitude = 0.0
		}

		WAYPOINT
		{
			name = dessertWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -6.5798
			longitude = -143.9952
