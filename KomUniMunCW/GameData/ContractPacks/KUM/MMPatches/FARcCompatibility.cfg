// Replaces 'Stock' with 'FARc' inside the vehicle lists
@CONTRACT_GROUP[KUM]:NEEDS[FerramAerospaceResearch]
{
	@DATA:HAS[#type[List?string?]]
	{
		@targetSatellites ^= :Stock/:FARc/:
		@targetDrones ^= :Stock/:FARc/:
		@targetStatics ^= :Stock/:FARc/:
		@targetFloats ^= :Stock/:FARc/:
		@targetSubmarines ^= :Stock/:FARc/:

		@midFighters ^= :Stock/:FARc/:
		@lateFighters ^= :Stock/:FARc/:
		@standardFighters ^= :Stock/:FARc/:

		@lateAWACS ^= :Stock/:FARc/:
		@standardAWACS ^= :Stock/:FARc/:

		@lateUAVs ^= :Stock/:FARc/:
		@standardUAVs ^= :Stock/:FARc/:
	}
}

// Replaces 'Stock' with 'FARc' for any contracts
@CONTRACT_TYPE[*]:HAS[#agent[Komnenus?Universalis?Munistorum]]:NEEDS[FerramAerospaceResearch]
{
	@BEHAVIOUR:HAS[#type[SpawnVessel]]
	{
		@VESSEL,*
		{
			@craftURL ^= :Stock/:FARc/:
		}
	}
}