// Replaces 'Stock' with 'FARc' inside the vehicle lists
@CONTRACT_GROUP[KUM]:BEFORE[ContractConfigurator]:NEEDS[FerramAerospaceResearch]
{
	@DATA:HAS[#targetSatellite[*]]
	{
		@targetDrone ^= :Stock/:FARc/:
		@targetSubmarine ^= :Stock/:FARc/:

		@earlyFighter ^= :Stock/:FARc/:
		@midFighter ^= :Stock/:FARc/:
		@lateFighter ^= :Stock/:FARc/:
		@standardFighter ^= :Stock/:FARc/:

		@earlyStriker ^= :Stock/:FARc/:
		@midStriker ^= :Stock/:FARc/:
		@lateStriker ^= :Stock/:FARc/:
		@standardStriker ^= :Stock/:FARc/:

		@earlyBomber ^= :Stock/:FARc/:
		@midBomber ^= :Stock/:FARc/:
		@lateBomber ^= :Stock/:FARc/:
		@standardBomber ^= :Stock/:FARc/:

		@earlyRecon ^= :Stock/:FARc/:
		@midRecon ^= :Stock/:FARc/:
		@lateRecon ^= :Stock/:FARc/:
		@standardRecon ^= :Stock/:FARc/:

		@midHelicopter ^= :Stock/:FARc/:
		@lateHelicopter ^= :Stock/:FARc/:
		@standardHelicopter ^= :Stock/:FARc/:

		@lateAWACS ^= :Stock/:FARc/:
		@standardAWACS ^= :Stock/:FARc/:

		@lateUAV ^= :Stock/:FARc/:
		@standardUAV ^= :Stock/:FARc/:

		@earlyWarship ^= :Stock/:FARc/:
		@midWarship ^= :Stock/:FARc/:
		@lateWarship ^= :Stock/:FARc/:
		@standardWarship ^= :Stock/:FARc/:

		@earlyBoat ^= :Stock/:FARc/:
		@midBoat ^= :Stock/:FARc/:
		@lateBoat ^= :Stock/:FARc/:
		@standardBoat ^= :Stock/:FARc/:

		@earlyCarrier ^= :Stock/:FARc/:
		@midCarrier ^= :Stock/:FARc/:
		@lateCarrier ^= :Stock/:FARc/:
		@standardCarrier ^= :Stock/:FARc/:

		@earlySubmarine ^= :Stock/:FARc/:
		@midSubmarine ^= :Stock/:FARc/:
		@lateSubmarine ^= :Stock/:FARc/:
		@standardSubmarine ^= :Stock/:FARc/:

		@lateUSV ^= :Stock/:FARc/:
		@standardUSV ^= :Stock/:FARc/:
	}
}

// Replaces 'Stock' with 'FARc' for any contracts of the KomUniMun agent
@CONTRACT_TYPE[*]:HAS[#agent[Komnenus?Universalis?Munistorum]]:BEFORE[ContractConfigurator]:NEEDS[FerramAerospaceResearch]
{
	@BEHAVIOUR:HAS[#type[SpawnVessel]]
	{
		@VESSEL,*
		{
			@craftURL ^= :Stock/:FARc/:
		}
	}
}