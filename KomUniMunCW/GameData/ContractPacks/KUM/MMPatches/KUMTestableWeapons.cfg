// AAM guidance types
@PART[*]:HAS[@MODULE[MissileLauncher]:HAS[#missileType[missile|Missile|MISSILE],#homingType[aampure|Aampure|AAMPURE|aamlead|Aamlead|AAMLEAD|aam|Aam|AAM|aamloft|Aamloft|AAMLOFT|pronav|Pronav|PRONAV|augpronav|Augpronav|AUGPRONAV|clos|Clos|CLOS|closthree|Closthree|CLOSTHREE|closlead|Closlead|CLOSLEAD|kappa|Kappa|KAPPA]]]:NEEDS[BDArmory]:FINAL
{
	@description = #$description$\n\nAAM-Testable
	%MODULE[ModuleTestSubject]
	{
		%useStaging = False
		%useEvent = True
		%situationMask = 15
		%useProgressForBodies = False
		%usePrestigeForSit = False
	}
}

