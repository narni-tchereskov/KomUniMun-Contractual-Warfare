// AAM guidance types
@PART[*]:HAS[@MODULE[MissileLauncher]:HAS[#missileType[missile],#homingType[aam|AAM|aamloft|pronav|heat|Heat|IR|radar|Radar]]]:NEEDS[BDArmory]:FINAL
{
	@description = #$description$\n\nAAM-Testable
	&MODULE[ModuleTestSubject]
	{
		useStaging = False
		useEvent = True
		situationMask = 15
		useProgressForBodies = False
		usePrestigeForSit = False
	}
}

