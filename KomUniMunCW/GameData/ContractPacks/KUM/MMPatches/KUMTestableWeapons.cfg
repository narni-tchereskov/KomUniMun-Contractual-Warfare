// AAM guidance types
@PART[*]:HAS[@MODULE[MissileLauncher]:HAS[#missileType[missile|Missile|MISSILE],#targetingType[radar|Radar|RADAR|heat|Heat|HEAT],~homingType[orbital|Orbital|ORBITAL|rcs|Rcs|RCS]]]:NEEDS[BDArmory]:FINAL
{
	@description = #$description$\n\nAAM-Testable
	&MODULE[ModuleTestSubject]
	{
		useStaging = False
		useEvent = True
		situationMask = 15
		useProgressForBodies = False
		usePrestigeForSit = False
	}
}

