// Description tagging, actually adds the description text
@PART[*]:HAS[#testType[AAM]]:FINAL
{
	@description = #$description$\n\nAAM-Testable
	%MODULE[ModuleTestSubject]
	{
		%useStaging = False
		%useEvent = True
		%situationMask = 15
		%useProgressForBodies = False
		%usePrestigeForSit = False
	}
}

