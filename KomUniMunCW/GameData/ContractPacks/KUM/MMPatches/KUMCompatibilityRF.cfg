// Replaces 'Stock' and 'FARc' with the RealFuels path inside the vehicle lists
@CONTRACT_GROUP[KUM]:BEFORE[ContractConfigurator]:NEEDS[RealFuels]
{
	@DATA:HAS[#targetSatellite[*]]
	{
		@targetDrone ^= :(Stock/|FARc/|Fueled/):RealFuels/$1:
		@targetSubmarine ^= :(Stock/|FARc/|Fueled/):RealFuels/$1:

		@earlyFighter ^= :(Stock/|FARc/|Fueled/):RealFuels/$1:
		@midFighter ^= :(Stock/|FARc/|Fueled/):RealFuels/$1:
		@lateFighter ^= :(Stock/|FARc/|Fueled/):RealFuels/$1:
