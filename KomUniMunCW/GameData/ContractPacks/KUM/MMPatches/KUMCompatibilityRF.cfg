// Replaces 'Stock' and 'FARc' with the RealFuels path inside the vehicle lists
@CONTRACT_GROUP[KUM]:BEFORE[ContractConfigurator]:NEEDS[RealFuels]
{
	@DATA:HAS[#targetSatellites[*]]
	{
		@targetDrones ^= :(Stock/|FARc/):RealFuels/$1:
		@targetSubmarines ^= :(Stock/|FARc/):RealFuels/$1:

		@midFighters ^= :(Stock/|FARc/):RealFuels/$1:
		@lateFighters ^= :(Stock/|FARc/):RealFuels/$1:
		@standardFighters ^= :(Stock/|FARc/):RealFuels/$1:

		@lateAWACS ^= :(Stock/|FARc/):RealFuels/$1:
		@standardAWACS ^= :(Stock/|FARc/):RealFuels/$1:

		@lateUAVs ^= :(Stock/|FARc/):RealFuels/$1:
		@standardUAVs ^= :(Stock/|FARc/):RealFuels/$1:
	}
}

// Adds the RealFuels path to the default filepaths
@CONTRACT_TYPE[*]:HAS[#agent[Komnenus?Universalis?Munistorum]]:BEFORE[ContractConfigurator]:NEEDS[RealFuels]
{
	@BEHAVIOUR:HAS[#type[SpawnVessel]]
	{
		@VESSEL,*
		{
			@craftURL ^= :(Stock/|FARc/):RealFuels/$1:
		}
	}
}