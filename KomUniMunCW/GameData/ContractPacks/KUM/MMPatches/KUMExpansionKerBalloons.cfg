// Appends the balloon target craft to the target list
@CONTRACT_GROUP[KUM]:BEFORE[ContractConfigurator]:NEEDS[KerBalloons]
{
	@DATA:HAS[#targetBalloon[*]]
	{
		@targetBalloon ^= :\]\s*$:, "ContractPacks/KUM/Assets/Ships/All/target/balloon_01a.craft", "ContractPacks/KUM/Assets/Ships/All/target/balloon_01b.craft", "ContractPacks/KUM/Assets/Ships/All/target/balloon_01c.craft", "ContractPacks/KUM/Assets/Ships/All/target/balloon_01d.craft", "ContractPacks/KUM/Assets/Ships/All/target/balloon_01e.craft"]:
	}
}