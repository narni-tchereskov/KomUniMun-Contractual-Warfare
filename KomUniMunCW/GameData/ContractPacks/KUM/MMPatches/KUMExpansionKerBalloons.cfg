// Appends the balloon target craft to the target list
@CONTRACT_GROUP[KUM]:BEFORE[ContractConfigurator]:NEEDS[KerBalloons]
{
	@DATA:HAS[#targetBalloons[*]]
	{
		@targetBalloons ^= :\]\s*$:, "ContractPacks/KUM/Assets/Ships/All/targets/target_balloon_01a.craft", "ContractPacks/KUM/Assets/Ships/All/targets/target_balloon_01b.craft", "ContractPacks/KUM/Assets/Ships/All/targets/target_balloon_01c.craft", "ContractPacks/KUM/Assets/Ships/All/targets/target_balloon_01d.craft", "ContractPacks/KUM/Assets/Ships/All/targets/target_balloon_01e.craft"]:
	}
}