// Appends the balloon target craft to the testOps target list.
@CONTRACT_GROUP[KUM]:FOR[KUMExpansionKerballoons]:NEEDS[ContractConfigurator,KerBalloons]:AFTER[KomUniMunCW]
{
	@CONTRACT_GROUP[munistorumTestOps]
	{
		@DATA
		{
			@targetBalloonsExtras ^= :(?<!target_balloon_01a\.craft")(\])$:,"ContractPacks/KUMExpansionKerballoons/Assets/Ships/targets/target_balloon_01a.craft"]:
		}
	}
}
