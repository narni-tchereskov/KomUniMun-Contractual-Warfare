CONTRACT_TYPE
{
	name = kumTestMissionSatellite1

	DATA
	{
		type = string
		hidden = true

		str_var_1 = #loc_KUM_kumTestMissionSatellite1_title_near
		str_var_2 = " ("
		str_var_3 = ")"
		str_var_4 = #loc_KUM_kumTestMissionSatellite1_desc
		str_var_5 = "Due to the proliferation of space debris as a consequence of this mission, it is likely that observers will condone this operation."
		str_var_6 = #loc_KUM_vessel_target_satellite
		str_var_7 = " STGT ID: "
		str_var_8 = "ContractPacks/KUM/Assets/Ships/"
		str_var_9 = #loc_KUM_test_param_test_the
		str_var_10 = " "
		str_var_11 = #loc_KUM_test_param_on_target_optional
		str_var_12 = #loc_KUM_test_param_have_one
		str_var_13 = #loc_KUM_test_param_on_your_vehicle
	}

	title = @/str_var_1 + @/str_var_2 + @/orbitBody + @/str_var_3
	genericTitle = #loc_KUM_kumTestMissionSatellite1_title

	group = munistorumTestOps
	agent = Komnenus Universalis Munistorum

	description = @/str_var_4 + @/str_var_5
	genericDescription = @/str_var_4 + @/str_var_5

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumTestMissionSatellite1_synopsis

	completedMessage = #loc_KUM_kumTestMissionSatellite1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = @/orbitBody

	maxCompletions = 0
	maxSimultaneous = 4

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Is part testing a parameter?
		partTestValue = Random(0,1)

		// Is recovery necessary?
		needRecoverValue = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetVessel = @/str_var_6 + @/str_var_7 + @/nameAppend
	}

	DATA
	{
		type = AvailablePart

		// Test Part
		testPart = AllParts().Where(b => b.IsUnlocked() && (b.Description().Contains("EKV-Testable") || b.Description().Contains("CNN-Testable"))).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 2 * (Random(0.5, 2.2) * Pow(2, 0.333333))
		reputation = 0 // Must be greater or equal to 0
		funds = 8000 * (Random(0.8, 1.2) * Pow(2, 0.333333))
	}

	DATA
	{
		type = CelestialBody

		// Planet
		orbitBody = OrbitedBodies().Where(b => b.IsHomeWorld() || (b.IsMoon() && b.Parent().IsHomeWorld())).Random()
		hidden = true
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnTarget
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel
			craftURL = @/str_var_8 + @/KUM:standardTargetSatellites.Random()
			flagURL = Squad/Flags/retro
			vesselType = Unknown
			owned = false
			targetBody = @/orbitBody

			ORBIT
			{
				SMA = Random(686750.0, 1373500.0)
				ECC = 0.0
				INC = Random(-90.0, 90.0)
				LPE = 4.0
				LAN = 140.0
				MNA = 0.0
				EPH = 1787.3
				REF = 1
			}
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = TestingSequence
		type = Sequence

		title = @/str_var_9 + @/str_var_10 + @/testPart + @/str_var_10 + @/str_var_11
		completedMessage = #loc_KUM_test_tests_complete

		rewardScience = (@/science * 2)
		rewardReputation = @/reputation
		rewardFunds = (@/funds / 2)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		REQUIREMENT
		{
			name = Expression
			type = Expression

			expression = @/partTestValue == 1
		}

		PARAMETER
		{
			name = TestProcedure
			type = PartTest

			notes = #loc_KUM_test_run_after

			optional = true

			part = @/testPart

			PARAMETER
			{
				name = HasTestPart
				type = PartValidation

				title = @/str_var_12 + @/str_var_10 + @/testPart + @/str_var_10 + @/str_var_13

				part = @/testPart
				minCount = 1
			}

			PARAMETER
			{
				name = RendezvousCraft
				type = Rendezvous

				title = #loc_KUM_test_param_approach_2km

				vessel = @/targetVessel

				disableOnStateChange = false

				distance = 2000.0
			}

			PARAMETER
			{
				name = DurationDelay
				type = Duration

				preWaitText = #loc_KUM_test_preWaitText
				waitingText = #loc_KUM_test_waitingText
				completionText = #loc_KUM_test_completionText

				completeInSequence = true

				duration = 20s

				startCriteria = PARAMETER_COMPLETION
				parameter = RendezvousCraft
			}
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_test_param_destroy_target

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_test_param_destroy_satellite

			vessel = @/targetVessel
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_test_stop_testbed

			completeInSequence = true

			REQUIREMENT
			{
				name = NeedLand
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_test_testbed_recovered

			completeInSequence = true

			REQUIREMENT
			{
				name = NeedRecover
				type = Expression

				expression = @/needRecoverValue == 1
			}
		}
	}
}
