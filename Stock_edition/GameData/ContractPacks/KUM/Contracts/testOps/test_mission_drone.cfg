CONTRACT_TYPE
{
	name = kumTestMissionDrone1

	DATA
	{
		type = string
		hidden = true

		str_var_1 = #loc_KUM_kumTestMissionDrone1_desc
		str_var_2 = "\n\nMission Latitude: "
		str_var_3 = "\nMission Longitude: "
		str_var_4 = "\n\n"
		str_var_5 = #loc_KUM_vessel_target_drone
		str_var_6 = " ATGT ID: "
		str_var_7 = "ContractPacks/KUM/Assets/Ships/"
		str_var_8 = #loc_KUM_test_param_test_the
		str_var_9 = " "
		str_var_10 = #loc_KUM_test_param_on_target_optional
		str_var_11 = #loc_KUM_test_param_have_one
		str_var_12 = #loc_KUM_test_param_on_your_vehicle
	}

	title = #loc_KUM_kumTestMissionDrone1_title
	genericTitle = #loc_KUM_kumTestMissionDrone1_title

	group = munistorumTestOps
	agent = Komnenus Universalis Munistorum

	description = @/str_var_1 + @/str_var_2 + @titleLat + @/str_var_3 + @titleLon + @/str_var_4
	genericDescription = #loc_KUM_kumTestMissionDrone1_desc

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumTestMissionDrone1_synopsis

	completedMessage = #loc_KUM_kumTestMissionDrone1_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 2

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Is part testing a parameter?
		partTestValue = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels

		// Target Names
		targetVessel = @/str_var_5 + @/str_var_6 + @/nameAppend
	}

	DATA
	{
		type = AvailablePart

		// Test Part
		testPart = AllParts().Where(b => b.IsUnlocked() && (b.Description().Contains("AAM-Testable") || b.Description().Contains("CNN-Testable"))).Random()
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 1 * (Random(0.5, 2.2) * Pow(2, 0.333333))
		reputation = 2 * (Random(0.8, 2.0) * Pow(2, 0.333333))
		funds = 4000 * (Random(0.8, 1.2) * Pow(2, 0.333333))

		// Vehicle Coordinates
		squadLat = Random(3.0, -2.0)
		squadLon = Random(-73.0, -69.0)
		squadAlt = 10000.0
		squadHdg = 0

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumRequiredUav
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnTarget
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel
			craftURL = @/str_var_7 + @/KUM:standardTargetDrones.Random()
			flagURL = Squad/Flags/retro
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			alt = @/squadAlt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel
	}

	// Parameters for completing the contract
	PARAMETER
	{
		name = TestingSequence
		type = Sequence

		title = @/str_var_8 + @/str_var_9 + @/testPart + @/str_var_9 + @/str_var_10
		completedMessage = #loc_KUM_test_tests_complete

		rewardScience = (@/science * 2)
		rewardReputation = @/reputation
		rewardFunds = (@/funds / 2)

		failureReputation = 0.0
		failureFunds = 0.0

		optional = true

		REQUIREMENT
		{
			name = Expression
			type = Expression

			expression = @/partTestValue == 1
		}

		PARAMETER
		{
			name = TestProcedure
			type = PartTest

			notes = #loc_KUM_test_run_after

			optional = true

			part = @/testPart

			PARAMETER
			{
				name = HasTestPart
				type = PartValidation

				title = @/str_var_11 + @/str_var_9 + @/testPart + @/str_var_9 + @/str_var_12

				part = @/testPart
				minCount = 1
			}

			PARAMETER
			{
				name = RendezvousCraft
				type = Rendezvous

				title = #loc_KUM_test_param_approach_500m

				vessel = @/targetVessel

				disableOnStateChange = false

				distance = 500.0
			}

			PARAMETER
			{
				name = DurationDelay
				type = Duration

				preWaitText = #loc_KUM_test_preWaitText
				waitingText = #loc_KUM_test_waitingText
				completionText = #loc_KUM_test_completionText

				completeInSequence = true

				duration = 20s

				startCriteria = PARAMETER_COMPLETION
				parameter = RendezvousCraft
			}
		}
	}

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_test_param_destroy_target

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_test_param_destroy_drone

			vessel = @/targetVessel
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_test_stop_testbed

			completeInSequence = true
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_test_testbed_recovered

			completeInSequence = true
		}
	}
}
