CONTRACT_TYPE
{
	name = kumAirMahi3

	DATA
	{
		type = string
		hidden = true

		str_var_1 = #loc_KUM_kumAirMahi3_title
		str_var_2 = " ("
		str_var_3 = ")"
		str_var_4 = #loc_KUM_kumAirMahi3_desc
		str_var_5 = "\nDestroy all hostile aircraft over the Mahi Mahi island, freeing our units from the constant surveillance and harassment of their aerial units."
		str_var_6 = "\n\nMission Latitude: "
		str_var_7 = "\nMission Longitude: "
		str_var_8 = "\n\n"
		str_var_9 = #loc_KUM_vessel_aircraft
		str_var_10 = " 1"
		str_var_11 = " AIR ID: "
		str_var_12 = " 2"
		str_var_13 = " 3"
		str_var_14 = #loc_KUM_vessel_uav
		str_var_15 = "ContractPacks/KUM/Assets/Ships/"
	}

	title = @/str_var_1 + @/str_var_2 + @titlePeriod + @/str_var_3
	genericTitle = #loc_KUM_kumAirMahi3_title

	group = munistorumAerial
	agent = Komnenus Universalis Munistorum

	description = @/str_var_4 + @/str_var_5 + @/str_var_6 + @titleLat + @/str_var_7 + @titleLon + @/str_var_8 + @/KUM:recoveryLocations
	genericDescription = @/str_var_4 + @/str_var_5

	topic = Weapons
	subject = Experiment

	synopsis = #loc_KUM_kumAirMahi3_synopsis

	completedMessage = #loc_KUM_kumAirMahi3_completed

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = int

		// Period of mission
		periodSelector = Random(0,1)
		hidden = true
	}

	DATA
	{
		type = string

		title = #loc_KUM_common_target_vessels
		titlePeriod = @/KUM:periodList.ElementAt(@/periodSelector + 1)

		// Target Names
		targetAircraft1 = @/str_var_9 + @/str_var_10 + @/str_var_11 + @/nameAppend
		targetAircraft2 = @/str_var_9 + @/str_var_12 + @/str_var_11 + @/nameAppend
		targetAircraft3 = @/str_var_9 + @/str_var_13 + @/str_var_11 + @/nameAppend
		targetUAV1 = @/str_var_14 + @/str_var_10 + @/str_var_11 + @/nameAppend
		targetUAV2 = @/str_var_14 + @/str_var_12 + @/str_var_11 + @/nameAppend
		targetUAV3 = @/str_var_14 + @/str_var_13 + @/str_var_11 + @/nameAppend
	}

	DATA
	{
		type = List<string>

		// Vehicle Lists
		aircraftList = @/periodSelector == 0 ? @/KUM:lateFighters : @/KUM:standardFighters
		uavList = @/periodSelector == 0 ? @/KUM:lateUAVs : @/KUM:standardUAVs
		hidden = true
	}

	DATA
	{
		type = double

		// Rewards
		science = 0.0 // Zero for non-test missions
		reputation = 8.5 * (Random(0.8, 2.0) * Pow((@/periodSelector + 2), 0.333333))
		funds = 8500 * (Random(0.8, 1.2) * Pow((@/periodSelector + 2), 0.333333))

		// Vehicle Coordinates
		squadLat = Random(-49.8, -53.8)
		squadLon = Random(-155.8, -159.8)
		squadAlt = 10000.0
		squadHdg = 0

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = kumAirMahi2
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnAircraft
		type = SpawnVessel

		VESSEL
		{
			name = @/targetAircraft1
			craftURL = @/str_var_15 + @/aircraftList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			alt = @/squadAlt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetAircraft2
			craftURL = @/str_var_15 + @/aircraftList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.02
			lon = @/squadLon - 0.02
			alt = @/squadAlt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetAircraft3
			craftURL = @/str_var_15 + @/aircraftList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.04
			lon = @/squadLon - 0.04
			alt = @/squadAlt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetUAV1
			craftURL = @/str_var_15 + @/uavList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.06
			lon = @/squadLon - 0.06
			alt = @/squadAlt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetUAV2
			craftURL = @/str_var_15 + @/uavList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.08
			lon = @/squadLon - 0.08
			alt = @/squadAlt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetUAV3
			craftURL = @/str_var_15 + @/uavList.Random()
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat - 0.10
			lon = @/squadLon - 0.10
			alt = @/squadAlt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetAircraft1
		vessel = @/targetAircraft2
		vessel = @/targetAircraft3
		vessel = @/targetUAV1
		vessel = @/targetUAV2
		vessel = @/targetUAV3
	}

	// Recovery waypoints
	BEHAVIOUR
	{
		name = ReturnWaypoint
		type = WaypointGenerator

		WAYPOINT
		{
			name = kscWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -0.1025
			longitude = -74.5752
			altitude = 68.4
		}

		WAYPOINT
		{
			name = islandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -1.5408
			longitude = -71.9097
			altitude = 117.0
		}

		WAYPOINT
		{
			name = inlandWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 20.6666
			longitude = -146.4666
			altitude = 422.0
		}

		WAYPOINT
		{
			name = glacierWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 73.5615
			longitude = 84.2474
			altitude = 0.0
		}

		WAYPOINT
		{
			name = coveWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 3.7476
			longitude = -72.2132
			altitude = 0.0
		}

		WAYPOINT
		{
			name = craterWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 8.3859
			longitude = -179.6977
			altitude = 0.0
		}

		WAYPOINT
		{
			name = mahiWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -49.8024
			longitude = -120.7659
			altitude = 0.0
		}

		WAYPOINT
		{
			name = dessertWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = -6.5798
			longitude = -143.9952
			altitude = 822.5
		}

		WAYPOINT
		{
			name = woomerangWaypoint

			hidden = true

			clustered = false
			underwater = false

			targetBody = HomeWorld()

			latitude = 45.29
			longitude = 136.11
			altitude = 739.0
		}
	}

	// Parameters for completing the contract

	// Combat parameters
	PARAMETER
	{
		name = CombatSequence
		type = Sequence

		title = #loc_KUM_common_engage_units

		PARAMETER
		{
			name = DestroyCraft
			type = TargetDestroyed

			title = #loc_KUM_common_eliminate_hostiles

			vessel = @/targetAircraft1
			vessel = @/targetAircraft2
			vessel = @/targetAircraft3
			vessel = @/targetUAV1
			vessel = @/targetUAV2
			vessel = @/targetUAV3
		}

		// Parameters for recovering the vessel after the mission
		PARAMETER
		{
			name = LandBase
			type = ReturnHome

			title = #loc_KUM_common_stop_vessel

			completeInSequence = true
		}

		PARAMETER
		{
			name = AnyBase
			type = Any

			title = #loc_KUM_common_return_ksc

			disableOnStateChange = false
			completeInSequence = true
			hideChildren = true

			PARAMETER
			{
				name = isInKsc
				type = VisitWaypoint

				index = 0
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInIsland
				type = VisitWaypoint

				index = 1
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInInland
				type = VisitWaypoint

				index = 2
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInGlacier
				type = VisitWaypoint

				index = 3
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCove
				type = VisitWaypoint

				index = 4
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInCrater
				type = VisitWaypoint

				index = 5
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInMahi
				type = VisitWaypoint

				index = 6
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInDessert
				type = VisitWaypoint

				index = 7
				distance = 2000.0
			}

			PARAMETER
			{
				name = isInWoomerang
				type = VisitWaypoint

				index = 8
				distance = 2000.0
			}
		}

		PARAMETER
		{
			name = RecoverBase
			type = RecoverVessel

			title = #loc_KUM_common_recover_vessel
			completedMessage = #loc_KUM_common_vessel_recovered

			completeInSequence = true
		}
	}
}
