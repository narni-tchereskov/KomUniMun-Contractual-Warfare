CONTRACT_TYPE
{
	name = kumDebugEkv

	title = "debugEkv" + " (" + @/orbitBody + ")"
	genericTitle = "debugEkv"

	group = munistorumDebug
	agent = Komnenus Universalis Munistorum

	description = "debugDescription"
	genericDescription = "debugDescription"

	topic = Weapons
	subject = Experiment

	synopsis = "debugSynopsis"

	completedMessage = "debugCompleted"

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = @/orbitBody

	maxCompletions = 0
	maxSimultaneous = 1

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = string

		title = "debugTargets"

		// Target Names
		targetVessel1 = "vessel 1 " + @/KUM:locSPC + @/nameAppend
		targetVessel2 = "vessel 2 " + @/KUM:locSPC + @/nameAppend
	}

	DATA
	{
		type = double

		// Rewards
		science = 1.0
		reputation = 1.0
		funds = 1.0
	}

	DATA
	{
		type = CelestialBody

		// Planet
		orbitBody = HomeWorld()
		hidden = true
	}

	DATA
	{
		type = double

		// Minimum orbit parameter avoids terrain, raw maximum avoids encounters
		safeMinRadius = @/orbitBody.Radius() + @/orbitBody.SpaceAltitudeThreshold()
		rawMaxRadius = @/orbitBody.Children().Count() > 0 ? (@/orbitBody.Children().First().SemiMajorAxis() - (@/orbitBody.Children().First().SphereOfInfluence() * 1.2)) : (@/orbitBody.SphereOfInfluence() * 0.8)
		hidden = true
	}

	DATA
	{
		type = double

		// Maximum orbit parameter
		safeMaxRadius = Max(@/safeMinRadius, @/rawMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// Peri and Apo apses for SMA calculation
		orbitPeriapsis = Random(@/safeMinRadius, @/safeMaxRadius)
		orbitApoapsis = Random(@/orbitPeriapsis, @/safeMaxRadius)
		hidden = true
	}

	DATA
	{
		type = double

		// SMA and ECC values to avoid orbits outside body SOI
		orbitSMA = (@/orbitPeriapsis + @/orbitApoapsis) / 2.0
		orbitECC = (@/orbitApoapsis - @/orbitPeriapsis) / (@/orbitApoapsis + @/orbitPeriapsis)
		hidden = true
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel1
			craftURL = "ContractPacks/KUM/Assets/Ships/Fueled/ekv/s_ekv_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = @/orbitBody

			ORBIT
			{
				SMA = @/orbitSMA
				ECC = @/orbitECC
				INC = Random(-180.0, 180.0)
				LPE = Random(0.0, 360.0)
				LAN = Random(0.0, 360.0)
				MNA = Random(0.0, 6.283185)
				EPH = UniversalTime()
			}
		}

		VESSEL
		{
			name = @/targetVessel2
			craftURL = "ContractPacks/KUM/Assets/Ships/Fueled/ekv/s_ekv_01b.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = @/orbitBody

			ORBIT
			{
				SMA = @/orbitSMA
				ECC = @/orbitECC
				INC = Random(-180.0, 180.0)
				LPE = Random(0.0, 360.0)
				LAN = Random(0.0, 360.0)
				MNA = Random(0.0, 6.283185)
				EPH = UniversalTime()
			}
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel1
		vessel = @/targetVessel2
	}

	// Parameters for completing the contract

	// Combat parameters
	PARAMETER
	{
		name = DestroyCraft
		type = TargetDestroyed

		title = "debugDestroyVessel"

		vessel = @/targetVessel1
		vessel = @/targetVessel2
	}
}
