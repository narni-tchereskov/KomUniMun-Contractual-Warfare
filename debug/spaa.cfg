CONTRACT_TYPE
{
	name = kumDebugSpaa

	title = "debugSpaa"
	genericTitle = "debugSpaa"

	group = munistorumDebug
	agent = Komnenus Universalis Munistorum

	description = "debugDescription" + @/KUM:missionLat + @titleLat + @/KUM:missionLon + @titleLon
	genericDescription = "debugDescription"

	topic = Weapons
	subject = Experiment

	synopsis = "debugSynopsis"

	completedMessage = "debugCompleted"

	minExpiry = 0.0
	maxExpiry = 0.0

	cancellable = true
	declinable = true

	targetBody = HomeWorld()

	maxCompletions = 0
	maxSimultaneous = 1

	DATA
	{
		type = int

		// Name Safety
		nameAppend = Random(0, 65535)
		uniquenessCheck = CONTRACT_ACTIVE
		hidden = true
	}

	DATA
	{
		type = string

		title = "debugTargets"

		// Target Names
		targetVessel1 = "vessel 1 " + @/KUM:locGND + @/nameAppend
		targetVessel2 = "vessel 2 " + @/KUM:locGND + @/nameAppend
		targetVessel3 = "vessel 3 " + @/KUM:locGND + @/nameAppend
		targetVessel4 = "vessel 4 " + @/KUM:locGND + @/nameAppend
	}

	DATA
	{
		type = double

		// Rewards
		science = 1.0
		reputation = 1.0
		funds = 1.0

		// Vehicle Coordinates
		squadLat = -0.242598
		squadLon = -74.720168
		squadHgt = 5.0
		squadHdg = 0.0

		// Title Coordinates
		titleLat = Round(@squadLat)
		titleLon = Round(@squadLon)
	}

	// Main contract rewards
	rewardScience = @/science
	rewardReputation = @/reputation
	rewardFunds = @/funds

	failureReputation = @/reputation / 4
	failureFunds = @/funds / 8
	advanceFunds = @/funds / 4

	BEHAVIOUR
	{
		name = SpawnVessel
		type = SpawnVessel

		VESSEL
		{
			name = @/targetVessel1
			craftURL = "ContractPacks/KUM/Assets/Ships/All/spaa/e_spaa_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetVessel2
			craftURL = "ContractPacks/KUM/Assets/Ships/All/spaa/m_spaa_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon + 0.001
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetVessel3
			craftURL = "ContractPacks/KUM/Assets/Ships/All/spaa/l_spaa_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon + 0.002
			height = @/squadHgt

			heading = @/squadHdg
		}

		VESSEL
		{
			name = @/targetVessel4
			craftURL = "ContractPacks/KUM/Assets/Ships/All/spaa/s_spaa_01a.craft"
			flagURL = Squad/Flags/satellite
			vesselType = Unknown
			owned = false
			targetBody = HomeWorld()

			lat = @/squadLat
			lon = @/squadLon + 0.003
			height = @/squadHgt

			heading = @/squadHdg
		}
	}

	// Destroy all mission vessels (if possible) for safety
	BEHAVIOUR
	{
		name = ContingencyCleanup
		type = DestroyVessel

		onState = CONTRACT_COMPLETED

		vessel = @/targetVessel1
		vessel = @/targetVessel2
		vessel = @/targetVessel3
		vessel = @/targetVessel4
	}

	// Parameters for completing the contract

	// Combat parameters
	PARAMETER
	{
		name = DestroyCraft
		type = TargetDestroyed

		title = "debugDestroyVessel"

		vessel = @/targetVessel1
		vessel = @/targetVessel2
		vessel = @/targetVessel3
		vessel = @/targetVessel4
	}
}
